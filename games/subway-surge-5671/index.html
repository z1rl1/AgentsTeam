<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Subway Surge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 10;
      pointer-events: none;
    }
    #score-box {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    #coin-box {
      color: #ffd700;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
    #start-screen, #gameover-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.85);
      z-index: 20;
    }
    #gameover-screen { display: none; }
    .title {
      font-size: 36px;
      color: #00e5ff;
      font-weight: bold;
      text-shadow: 0 0 20px #00e5ff;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 30px;
    }
    .btn {
      background: linear-gradient(180deg, #00e5ff, #0088cc);
      color: #fff;
      border: none;
      padding: 15px 50px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      box-shadow: 0 4px 15px rgba(0,200,255,0.4);
    }
    .final-score {
      font-size: 28px;
      color: #ffd700;
      margin: 10px 0;
    }
    .controls-hint {
      position: absolute;
      bottom: 20px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score-box">0</div>
    <div id="coin-box">🪙 0</div>
  </div>

  <div id="start-screen">
    <div class="title">🏃 SUBWAY SURGE</div>
    <div class="subtitle">Беги, уворачивайся, собирай монеты!</div>
    <button class="btn" onclick="startGame()">ИГРАТЬ</button>
    <div class="controls-hint">← → смена дорожки | ↑ прыжок | ↓ кувырок</div>
  </div>

  <div id="gameover-screen">
    <div class="title">💥 GAME OVER</div>
    <div class="final-score">Счёт: <span id="final-score">0</span></div>
    <div class="subtitle">Монеты: <span id="final-coins">0</span></div>
    <button class="btn" onclick="startGame()">ЗАНОВО</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const W = 400;
    const H = 650;
    canvas.width = W;
    canvas.height = H;

    const LANE_W = W / 3;
    const PLAYER_W = 40;
    const PLAYER_H = 60;

    let gameState = 'START';
    let score = 0;
    let coins = 0;
    let speed = 5;
    let dist = 0;
    let lane = 1;
    let targetLane = 1;
    let playerY = H - 150;
    let isJumping = false;
    let isSliding = false;
    let jumpVel = 0;
    let slideTimer = 0;
    let invincible = 0;
    let coinAnim = [];

    let obstacles = [];
    let coinObjects = [];
    let trainCars = [];
    let particles = [];

    let animFrame = 0;
    let lastTime = 0;

    function startGame() {
      score = 0;
      coins = 0;
      speed = 5;
      dist = 0;
      lane = 1;
      targetLane = 1;
      playerY = H - 150;
      isJumping = false;
      isSliding = false;
      slideTimer = 0;
      invincible = 0;
      obstacles = [];
      coinObjects = [];
      trainCars = [];
      coinAnim = [];
      particles = [];
      gameState = 'PLAYING';
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('gameover-screen').style.display = 'none';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      document.getElementById('final-score').textContent = score;
      document.getElementById('final-coins').textContent = coins;
      document.getElementById('gameover-screen').style.display = 'flex';
    }

    function spawnObstacle() {
      const type = Math.random();
      const laneIdx = Math.floor(Math.random() * 3);

      if (type < 0.3) {
        // Single barrier
        obstacles.push({ lane: laneIdx, type: 'barrier', h: 50, w: LANE_W - 20, y: -80, passed: false });
      } else if (type < 0.55) {
        // Double barrier (2 lanes)
        const skip = Math.floor(Math.random() * 3);
        for (let i = 0; i < 3; i++) {
          if (i !== skip) {
            obstacles.push({ lane: i, type: 'barrier', h: 50, w: LANE_W - 20, y: -80, passed: false });
          }
        }
      } else if (type < 0.75) {
        // Train
        const carCount = 2 + Math.floor(Math.random() * 2);
        for (let c = 0; c < carCount; c++) {
          trainCars.push({ lane: laneIdx, y: -100 - c * 110, type: 'train', passed: false });
        }
      } else {
        // Jump barrier (low)
        obstacles.push({ lane: laneIdx, type: 'lowbar', h: 30, w: LANE_W - 20, y: -60, passed: false });
      }
    }

    function spawnCoins() {
      const laneIdx = Math.floor(Math.random() * 3);
      const isRow = Math.random() > 0.5;
      const count = isRow ? 5 : 3;

      for (let i = 0; i < count; i++) {
        coinObjects.push({
          lane: laneIdx,
          x: laneIdx * LANE_W + LANE_W / 2,
          y: -50 - i * 40,
          size: 18,
          glow: 0
        });
      }
    }

    function spawnCoinParticles(x, y) {
      for (let i = 0; i < 6; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 20,
          color: '#ffd700',
          size: 4
        });
      }
    }

    function drawBackground() {
      // Sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#1a1a2e');
      sky.addColorStop(1, '#16213e');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Buildings silhouette
      ctx.fillStyle = '#0d0d1a';
      const bx = (dist * 0.5) % 200;
      for (let i = -1; i < 6; i++) {
        const bwx = i * 120 - bx;
        const bh = 150 + Math.sin(i * 3.7) * 80;
        ctx.fillRect(bwx, H - bh - 100, 90, bh);
        // Windows
        ctx.fillStyle = '#ffcc00';
        for (let wy = H - bh - 80; wy < H - 120; wy += 25) {
          for (let wx = bwx + 10; wx < bwx + 80; wx += 22) {
            if (Math.random() > 0.3) {
              ctx.fillRect(wx, wy, 12, 15);
            }
          }
        }
        ctx.fillStyle = '#0d0d1a';
      }

      // Train tracks area
      ctx.fillStyle = '#2a2a3a';
      ctx.fillRect(0, H - 100, W, 100);

      // 3 lanes
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 2;
      for (let i = 1; i < 3; i++) {
        ctx.beginPath();
        ctx.setLineDash([20, 15]);
        ctx.moveTo(i * LANE_W, H - 100);
        ctx.lineTo(i * LANE_W, H);
        ctx.stroke();
      }
      ctx.setLineDash([]);

      // Lane guides scrolling
      ctx.strokeStyle = '#555';
      const laneOffset = (dist * speed * 0.5) % 40;
      for (let y = H - 100 + laneOffset; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const px = lane * LANE_W + LANE_W / 2 - PLAYER_W / 2;
      const py = playerY;

      if (invincible > 0 && Math.floor(invincible / 4) % 2 === 0) return;

      const bobY = Math.sin(animFrame * 0.3) * 3;

      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(px + PLAYER_W/2, H - 95, PLAYER_W/2, 8, 0, 0, Math.PI*2);
      ctx.fill();

      if (isSliding) {
        // Sliding pose
        ctx.fillStyle = '#2255dd';
        ctx.fillRect(px - 5, py + PLAYER_H/2, PLAYER_W + 10, PLAYER_H/2 - 10);

        // Head
        ctx.fillStyle = '#ffcc88';
        ctx.beginPath();
        ctx.arc(px + PLAYER_W/2, py + PLAYER_H/2 + 5, 12, 0, Math.PI*2);
        ctx.fill();

        // Helmet
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.ellipse(px + PLAYER_W/2, py + PLAYER_H/2, 14, 8, 0, 0, Math.PI*2);
        ctx.fill();
      } else {
        // Running pose
        const runPhase = animFrame * 0.4;

        // Legs
        ctx.fillStyle = '#1a3a8a';
        ctx.save();
        ctx.translate(px + PLAYER_W * 0.35, py + PLAYER_H * 0.7);
        ctx.rotate(Math.sin(runPhase) * 0.5);
        ctx.fillRect(-4, 0, 8, 22);
        ctx.restore();

        ctx.save();
        ctx.translate(px + PLAYER_W * 0.65, py + PLAYER_H * 0.7);
        ctx.rotate(-Math.sin(runPhase) * 0.5);
        ctx.fillRect(-4, 0, 8, 22);
        ctx.restore();

        // Body
        ctx.fillStyle = '#2255dd';
        ctx.fillRect(px + 5, py + 20 + bobY, PLAYER_W - 10, PLAYER_H * 0.45);

        // Jacket detail
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(px + PLAYER_W/2 - 3, py + 22 + bobY, 6, PLAYER_H * 0.4);

        // Head
        ctx.fillStyle = '#ffcc88';
        ctx.beginPath();
        ctx.arc(px + PLAYER_W/2, py + 12 + bobY, 13, 0, Math.PI*2);
        ctx.fill();

        // Helmet
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        ctx.arc(px + PLAYER_W/2, py + 8 + bobY, 14, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(px + PLAYER_W/2 - 14, py + 6 + bobY, 28, 5);

        // Sunglasses
        ctx.fillStyle = '#222';
        ctx.fillRect(px + PLAYER_W/2 - 9, py + 10 + bobY, 18, 4);

        // Arms
        ctx.fillStyle = '#2255dd';
        ctx.save();
        ctx.translate(px + 3, py + 25 + bobY);
        ctx.rotate(-Math.sin(runPhase) * 0.4);
        ctx.fillRect(-3, 0, 6, 18);
        ctx.restore();

        ctx.save();
        ctx.translate(px + PLAYER_W - 3, py + 25 + bobY);
        ctx.rotate(Math.sin(runPhase) * 0.4);
        ctx.fillRect(-3, 0, 6, 18);
        ctx.restore();
      }
    }

    function drawObstacle(o) {
      const ox = o.lane * LANE_W + 10;
      const ow = LANE_W - 20;

      if (o.type === 'barrier') {
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(ox, o.y, ow, o.h);
        ctx.fillStyle = '#cc0000';
        ctx.fillRect(ox + ow * 0.3, o.y + 5, ow * 0.4, o.h - 10);
        // Warning stripes
        ctx.fillStyle = '#ffcc00';
        for (let i = 0; i < 3; i++) {
          ctx.fillRect(ox + 5 + i * (ow/3), o.y + 5, 8, o.h - 10);
        }
      } else if (o.type === 'lowbar') {
        ctx.fillStyle = '#ffaa00';
        ctx.fillRect(ox, o.y, ow, o.h);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(ox + 5, o.y + 5, ow - 10, 5);
      }
    }

    function drawTrainCar(t) {
      const tx = t.lane * LANE_W + 5;
      const tw = LANE_W - 10;
      const th = 100;

      // Train body
      ctx.fillStyle = '#888899';
      ctx.fillRect(tx, t.y, tw, th);

      // Windows
      ctx.fillStyle = '#aaccff';
      ctx.fillRect(tx + 5, t.y + 10, tw/2 - 8, 30);
      ctx.fillRect(tx + tw/2 + 3, t.y + 10, tw/2 - 8, 30);

      // Door lines
      ctx.fillStyle = '#666677';
      ctx.fillRect(tx + tw/2 - 2, t.y, 4, th);

      // Wheels
      ctx.fillStyle = '#333';
      ctx.beginPath();
      ctx.arc(tx + tw * 0.25, t.y + th, 10, 0, Math.PI*2);
      ctx.arc(tx + tw * 0.75, t.y + th, 10, 0, Math.PI*2);
      ctx.fill();
    }

    function drawCoin(c) {
      c.glow = (c.glow + 0.1) % (Math.PI * 2);
      const glowSize = 2 + Math.sin(c.glow) * 2;

      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.size + glowSize, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#ffee88';
      ctx.beginPath();
      ctx.arc(c.x - 2, c.y - 2, c.size * 0.6, 0, Math.PI*2);
      ctx.fill();

      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', c.x, c.y + 4);
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / 20;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function update(dt) {
      if (gameState !== 'PLAYING') return;

      animFrame++;
      dist += speed * 0.016;
      score = Math.floor(dist / 10);

      // Speed increase
      if (score > 0 && score % 500 === 0) {
        speed = Math.min(15, 5 + Math.floor(score / 500) * 0.5);
      }

      // Lane movement
      const laneSpeed = 0.2;
      lane += (targetLane - lane) * laneSpeed;

      // Jump physics
      if (isJumping) {
        playerY += jumpVel;
        jumpVel += 0.8;

        if (playerY >= H - 150) {
          playerY = H - 150;
          isJumping = false;
          jumpVel = 0;
        }
      }

      // Slide timer
      if (isSliding) {
        slideTimer--;
        if (slideTimer <= 0) isSliding = false;
      }

      // Invincibility
      if (invincible > 0) invincible--;

      // Spawn obstacles
      if (Math.random() < 0.015 + speed * 0.002) {
        spawnObstacle();
      }

      // Spawn coins
      if (Math.random() < 0.04) {
        spawnCoins();
      }

      // Update obstacles
      obstacles.forEach(o => {
        o.y += speed;
      });

      trainCars.forEach(t => {
        t.y += speed;
      });

      // Update coins
      coinObjects.forEach(c => {
        c.y += speed;
      });

      // Update particles
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
      });
      particles = particles.filter(p => p.life > 0);

      // Collision with obstacles
      if (invincible <= 0) {
        const px = lane * LANE_W + LANE_W / 2 - PLAYER_W / 2;
        const py = playerY;
        const ph = isSliding ? PLAYER_H / 2 : PLAYER_H;
        const pyOff = isSliding ? PLAYER_H / 2 : 0;

        for (let o of obstacles) {
          if (o.passed) continue;
          const ox = o.lane * LANE_W + 10;
          const oy = o.y;

          if (px + PLAYER_W > ox && px < ox + LANE_W - 20) {
            if (py + ph > oy && py + ph < oy + o.h + speed) {
              if (o.type === 'lowbar' && isJumping && playerY < H - 200) continue;
              gameOver();
              return;
            }
          }

          if (oy > H && !o.passed) {
            o.passed = true;
          }
        }

        for (let t of trainCars) {
          if (t.passed) continue;
          const tx = t.lane * LANE_W + 5;

          if (px + PLAYER_W > tx && px < tx + LANE_W - 10) {
            if (py + ph > t.y && py < t.y + 100) {
              gameOver();
              return;
            }
          }

          if (t.y > H && !t.passed) {
            t.passed = true;
          }
        }
      }

      // Coin collection
      const playerCenterX = lane * LANE_W + LANE_W / 2;
      const playerCenterY = playerY + PLAYER_H / 2;

      coinObjects = coinObjects.filter(c => {
        const dx = c.x - playerCenterX;
        const dy = c.y - playerCenterY;
        const dist2 = Math.sqrt(dx*dx + dy*dy);

        if (dist2 < c.size + 25) {
          coins++;
          spawnCoinParticles(c.x, c.y);
          return false;
        }

        if (c.y > H + 50) return false;
        return true;
      });

      obstacles = obstacles.filter(o => o.y < H + 100);
      trainCars = trainCars.filter(t => t.y < H + 150);

      document.getElementById('score-box').textContent = score;
      document.getElementById('coin-box').textContent = '🪙 ' + coins;
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();

      obstacles.forEach(drawObstacle);
      trainCars.forEach(drawTrainCar);
      coinObjects.forEach(drawCoin);
      drawParticles();
      drawPlayer();
    }

    function gameLoop(timestamp) {
      if (timestamp - lastTime >= 16) {
        update(16);
        lastTime = timestamp;
      }
      render();
      requestAnimationFrame(gameLoop);
    }

    // Keyboard controls
    document.addEventListener('keydown', e => {
      if (gameState !== 'PLAYING') {
        if (e.key === 'Enter' || e.key === ' ') startGame();
        return;
      }

      switch(e.key) {
        case 'ArrowLeft':
          targetLane = Math.max(0, targetLane - 1);
          break;
        case 'ArrowRight':
          targetLane = Math.min(2, targetLane + 1);
          break;
        case 'ArrowUp':
          if (!isJumping) {
            isJumping = true;
            jumpVel = -14;
          }
          break;
        case 'ArrowDown':
          if (!isSliding && !isJumping) {
            isSliding = true;
            slideTimer = 30;
          }
          break;
      }
    });

    // Touch controls
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (gameState !== 'PLAYING') {
        startGame();
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 30) targetLane = Math.min(2, targetLane + 1);
        else if (dx < -30) targetLane = Math.max(0, targetLane - 1);
      } else {
        if (dy < -30 && !isJumping) {
          isJumping = true;
          jumpVel = -14;
        } else if (dy > 30 && !isSliding && !isJumping) {
          isSliding = true;
          slideTimer = 30;
        }
      }
    }, { passive: false });

    // Mouse controls for desktop testing
    canvas.addEventListener('click', e => {
      if (gameState !== 'PLAYING') {
        startGame();
      }
    });

    gameLoop(0);
  </script>
</body>
</html>
