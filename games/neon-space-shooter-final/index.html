<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        #gameCanvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
        #muteBtn {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(255, 68, 68, 0.3);
            border: 2px solid #ff4444;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            z-index: 100;
            transition: all 0.3s;
        }
        #muteBtn:hover {
            background: rgba(255, 68, 68, 0.6);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button id="muteBtn">🔊 Звук</button>
    <script>
    (function() {
        'use strict';
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const muteBtn = document.getElementById('muteBtn');
        
        // Canvas setup
        const BASE_WIDTH = 960;
        const BASE_HEIGHT = 540;
        let scale = 1;
        
        function resizeCanvas() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const gameRatio = BASE_WIDTH / BASE_HEIGHT;
            if (windowRatio > gameRatio) {
                canvas.height = window.innerHeight;
                canvas.width = canvas.height * gameRatio;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = canvas.width / gameRatio;
            }
            scale = canvas.width / BASE_WIDTH;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // Colors
        const COLORS = {
            bg: '#0d1117',
            primary: '#ff4444',
            secondary: '#cc0000',
            accent: '#ff6666',
            text: '#ffffff',
            neonBlue: '#00ffff',
            neonGreen: '#00ff00',
            neonPurple: '#ff00ff',
            neonYellow: '#ffff00'
        };
        
        // Audio system
        let audioCtx = null;
        let isMuted = false;
        let musicSource = null;
        let musicGain = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playSound(type) {
            if (!audioCtx || isMuted) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            switch(type) {
                case 'shoot':
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'explosion':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'pickup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'hit':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'powerup':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'boss':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.5);
                    break;
            }
        }
        
        function startMusic() {
            if (!audioCtx || isMuted || musicSource) return;
            try {
                const audio = new Audio('assets/theme.mp3');
                audio.loop = true;
                audio.volume = 0.3;
                musicSource = audio;
                if (!isMuted) audio.play().catch(() => {});
            } catch(e) {
                console.log('Music not available');
            }
        }
        
        function toggleMute() {
            isMuted = !isMuted;
            muteBtn.textContent = isMuted ? '🔇 Звук' : '🔊 Звук';
            if (musicSource) musicSource.volume = isMuted ? 0 : 0.3;
        }
        muteBtn.addEventListener('click', toggleMute);
        
        // Asset loading
        const assets = {
            background: new Image(),
            sprites: new Image(),
            title: new Image()
        };
        let assetsLoaded = { background: false, sprites: false, title: false };
        
        assets.background.src = 'assets/background.png';
        assets.background.onload = () => assetsLoaded.background = true;
        assets.sprites.src = 'assets/sprites.png';
        assets.sprites.onload = () => assetsLoaded.sprites = true;
        assets.title.src = 'assets/title.png';
        assets.title.onload = () => assetsLoaded.title = true;
        
        function drawCover(img, x, y, w, h) {
            if (!img || !img.complete) return false;
            const imgRatio = img.width / img.height;
            const targetRatio = w / h;
            let sx, sy, sw, sh;
            if (imgRatio > targetRatio) {
                sh = img.height;
                sw = sh * targetRatio;
                sx = (img.width - sw) / 2;
                sy = 0;
            } else {
                sw = img.width;
                sh = sw / targetRatio;
                sx = 0;
                sy = (img.height - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
            return true;
        }
        
        // Game state
        const GameState = {
            MENU: 'menu',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAMEOVER: 'gameover',
            WIN: 'win'
        };
        
        let gameState = GameState.MENU;
        let score = 0;
        let highScore = localStorage.getItem('neonShooterHighScore') || 0;
        let wave = 1;
        let waveTimer = 0;
        let waveEnemiesSpawned = 0;
        let waveEnemiesTotal = 0;
        let screenShake = 0;
        let screenFlash = 0;
        let screenFlashColor = COLORS.accent;
        
        // Input
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
            if (gameState === GameState.MENU && (e.code === 'Space' || e.code === 'Enter')) {
                initAudio();
                startGame();
            }
            if (gameState === GameState.GAMEOVER && (e.code === 'Space' || e.code === 'Enter')) {
                startGame();
            }
            if (gameState === GameState.PLAYING && e.code === 'Escape') {
                gameState = GameState.PAUSED;
            }
            if (gameState === GameState.PAUSED && (e.code === 'Escape' || e.code === 'Space')) {
                gameState = GameState.PLAYING;
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        
        // Player
        const player = {
            x: BASE_WIDTH / 2,
            y: BASE_HEIGHT - 80,
            width: 50,
            height: 40,
            speed: 320,
            health: 100,
            maxHealth: 100,
            lives: 3,
            shootCooldown: 0,
            shootDelay: 0.15,
            rapidFire: false,
            rapidFireTimer: 0,
            shield: false,
            shieldTimer: 0,
            invincible: false,
            invincibleTimer: 0,
            trail: []
        };
        
        // Arrays
        let bullets = [];
        let enemyBullets = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let stars = [];
        let explosions = [];
        
        // Initialize stars
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * BASE_WIDTH,
                    y: Math.random() * BASE_HEIGHT,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 50 + 20,
                    brightness: Math.random() * 0.5 + 0.5
                });
            }
        }
        initStars();
        
        // Particle system
        function createParticle(x, y, color, count = 10, speed = 100, life = 0.5) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * speed + 20;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel,
                    color: color,
                    size: Math.random() * 4 + 2,
                    life: life,
                    maxLife: life,
                    type: 'spark'
                });
            }
        }
        
        function createExplosion(x, y, color, large = false) {
            const count = large ? 30 : 15;
            createParticle(x, y, color, count, large ? 200 : 120, large ? 0.8 : 0.5);
            explosions.push({
                x: x,
                y: y,
                radius: 0,
                maxRadius: large ? 60 : 30,
                color: color,
                life: 0.3,
                maxLife: 0.3
            });
            screenShake = large ? 15 : 8;
            screenFlash = 0.1;
            screenFlashColor = color;
        }
        
        // Enemy types
        const EnemyTypes = {
            BUG: {
                name: 'bug',
                width: 30,
                height: 25,
                health: 20,
                speed: 100,
                points: 100,
                color: COLORS.neonGreen,
                shootChance: 0.01,
                pattern: 'zigzag'
            },
            SQUID: {
                name: 'squid',
                width: 35,
                height: 30,
                health: 35,
                speed: 80,
                points: 150,
                color: COLORS.neonPurple,
                shootChance: 0.02,
                pattern: 'wave'
            },
            CRUISER: {
                name: 'cruiser',
                width: 50,
                height: 40,
                health: 60,
                speed: 60,
                points: 250,
                color: COLORS.neonBlue,
                shootChance: 0.03,
                pattern: 'straight'
            },
            BOSS: {
                name: 'boss',
                width: 120,
                height: 80,
                health: 500,
                speed: 40,
                points: 2000,
                color: COLORS.primary,
                shootChance: 0.05,
                pattern: 'boss'
            }
        };
        
        // Powerup types
        const PowerupTypes = ['shield', 'rapidfire', 'bomb', 'life'];
        
        // Start game
        function startGame() {
            gameState = GameState.PLAYING;
            score = 0;
            wave = 1;
            waveTimer = 0;
            waveEnemiesSpawned = 0;
            waveEnemiesTotal = 10;
            
            player.x = BASE_WIDTH / 2;
            player.y = BASE_HEIGHT - 80;
            player.health = 100;
            player.maxHealth = 100;
            player.lives = 3;
            player.rapidFire = false;
            player.shield = false;
            player.invincible = false;
            player.trail = [];
            
            bullets = [];
            enemyBullets = [];
            enemies = [];
            particles = [];
            powerups = [];
            explosions = [];
            
            startMusic();
        }
        
        // Spawn enemy
        function spawnEnemy(type) {
            const enemy = {
                ...type,
                x: Math.random() * (BASE_WIDTH - type.width - 40) + type.width / 2 + 20,
                y: -type.height,
                maxHealth: type.health,
                shootTimer: Math.random() * 2,
                moveTimer: 0,
                moveDir: Math.random() > 0.5 ? 1 : -1,
                phase: Math.random() * Math.PI * 2,
                waveAmp: 50 + Math.random() * 30
            };
            enemies.push(enemy);
        }
        
        // Spawn boss
        function spawnBoss() {
            playSound('boss');
            const boss = {
                ...EnemyTypes.BOSS,
                x: BASE_WIDTH / 2,
                y: -EnemyTypes.BOSS.height,
                maxHealth: EnemyTypes.BOSS.health * (1 + wave * 0.3),
                health: EnemyTypes.BOSS.health * (1 + wave * 0.3),
                phase: 0,
                attackPattern: 0
            };
            enemies.push(boss);
            screenShake = 20;
            screenFlash = 0.3;
            screenFlashColor = COLORS.primary;
        }
        
        // Spawn powerup
        function spawnPowerup(x, y) {
            const type = PowerupTypes[Math.floor(Math.random() * PowerupTypes.length)];
            powerups.push({
                x: x,
                y: y,
                type: type,
                size: 20,
                life: 8,
                glow: 0
            });
        }
        
        // Update functions
        function updatePlayer(dt) {
            // Movement
            if (keys['ArrowLeft'] || keys['KeyA']) {
                player.x -= player.speed * dt;
            }
            if (keys['ArrowRight'] || keys['KeyD']) {
                player.x += player.speed * dt;
            }
            if (keys['ArrowUp'] || keys['KeyW']) {
                player.y -= player.speed * dt;
            }
            if (keys['ArrowDown'] || keys['KeyS']) {
                player.y += player.speed * dt;
            }
            
            // Bounds
            player.x = Math.max(player.width / 2, Math.min(BASE_WIDTH - player.width / 2, player.x));
            player.y = Math.max(BASE_HEIGHT / 2, Math.min(BASE_HEIGHT - player.height / 2, player.y));
            
            // Shooting
            if (player.shootCooldown > 0) {
                player.shootCooldown -= dt;
            }
            
            if (keys['Space'] && player.shootCooldown <= 0) {
                const delay = player.rapidFire ? player.shootDelay / 2 : player.shootDelay;
                player.shootCooldown = delay;
                
                bullets.push({
                    x: player.x,
                    y: player.y - player.height / 2,
                    vx: 0,
                    vy: -500,
                    size: 5,
                    color: COLORS.accent,
                    glow: 15
                });
                createParticle(player.x, player.y - player.height / 2, COLORS.accent, 3, 50, 0.2);
                playSound('shoot');
            }
            
            // Trail
            player.trail.unshift({ x: player.x, y: player.y });
            if (player.trail.length > 15) player.trail.pop();
            
            // Timers
            if (player.rapidFire) {
                player.rapidFireTimer -= dt;
                if (player.rapidFireTimer <= 0) player.rapidFire = false;
            }
            if (player.shield) {
                player.shieldTimer -= dt;
                if (player.shieldTimer <= 0) player.shield = false;
            }
            if (player.invincible) {
                player.invincibleTimer -= dt;
                if (player.invincibleTimer <= 0) player.invincible = false;
            }
        }
        
        function updateBullets(dt) {
            bullets = bullets.filter(b => {
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                
                // Glow trail
                createParticle(b.x, b.y, b.color, 1, 20, 0.15);
                
                return b.y > -20 && b.y < BASE_HEIGHT + 20 && b.x > -20 && b.x < BASE_WIDTH + 20;
            });
            
            enemyBullets = enemyBullets.filter(b => {
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                
                // Check collision with player
                if (!player.invincible) {
                    const dx = b.x - player.x;
                    const dy = b.y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < b.size + 20) {
                        if (player.shield) {
                            player.shield = false;
                            player.shieldTimer = 0;
                            createParticle(player.x, player.y, COLORS.neonBlue, 20, 150, 0.3);
                        } else {
                            player.health -= 15;
                            screenShake = 10;
                            screenFlash = 0.15;
                            screenFlashColor = COLORS.secondary;
                            playSound('hit');
                            createParticle(player.x, player.y, COLORS.primary, 15, 100, 0.3);
                            
                            if (player.health <= 0) {
                                player.lives--;
                                if (player.lives <= 0) {
                                    gameState = GameState.GAMEOVER;
                                    createExplosion(player.x, player.y, COLORS.primary, true);
                                    if (score > highScore) {
                                        highScore = score;
                                        localStorage.setItem('neonShooterHighScore', highScore);
                                    }
                                } else {
                                    player.health = player.maxHealth;
                                    player.invincible = true;
                                    player.invincibleTimer = 2;
                                    createExplosion(player.x, player.y, COLORS.accent, true);
                                }
                            }
                        }
                        return false;
                    }
                }
                
                return b.y > -20 && b.y < BASE_HEIGHT + 20 && b.x > -20 && b.x < BASE_WIDTH + 20;
            });
        }
        
        function updateEnemies(dt) {
            enemies = enemies.filter(e => {
                e.moveTimer += dt;
                e.phase += dt * 3;
                
                // Movement patterns
                switch (e.pattern) {
                    case 'zigzag':
                        e.x += Math.sin(e.phase) * 80 * dt;
                        e.y += e.speed * dt;
                        break;
                    case 'wave':
                        e.y += e.speed * dt;
                        e.x = BASE_WIDTH / 2 + Math.sin(e.phase) * e.waveAmp;
                        break;
                    case 'straight':
                        e.y += e.speed * dt;
                        break;
                    case 'boss':
                        if (e.y < 80) {
                            e.y += e.speed * dt;
                        } else {
                            e.x += Math.sin(e.phase * 0.5) * 100 * dt;
                            e.attackPattern += dt;
                            
                            // Boss attacks
                            if (e.attackPattern > 0.8) {
                                e.attackPattern = 0;
                                for (let i = -2; i <= 2; i++) {
                                    enemyBullets.push({
                                        x: e.x + i * 20,
                                        y: e.y + e.height / 2,
                                        vx: i * 30,
                                        vy: 200,
                                        size: 8,
                                        color: COLORS.primary
                                    });
                                }
                            }
                        }
                        break;
                }
                
                // Bounds for non-boss enemies
                if (e.name !== 'boss') {
                    e.x = Math.max(e.width / 2, Math.min(BASE_WIDTH - e.width / 2, e.x));
                }
                
                // Shooting
                e.shootTimer += dt;
                if (e.shootTimer > 1 / e.shootChance && e.y > 0) {
                    e.shootTimer = 0;
                    enemyBullets.push({
                        x: e.x,
                        y: e.y + e.height / 2,
                        vx: 0,
                        vy: 250,
                        size: 6,
                        color: e.color
                    });
                }
                
                // Check collision with bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    const dx = b.x - e.x;
                    const dy = b.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < e.width / 2 + b.size) {
                        e.health -= 25;
                        bullets.splice(i, 1);
                        createParticle(b.x, b.y, e.color, 5, 80, 0.2);
                        playSound('hit');
                        
                        if (e.health <= 0) {
                            score += e.points;
                            createExplosion(e.x, e.y, e.color, e.name === 'boss');
                            playSound('explosion');
                            
                            // Drop powerup
                            if (Math.random() < 0.25) {
                                spawnPowerup(e.x, e.y);
                            }
                            
                            // Spawn smaller enemies
                            if (e.name === 'cruiser') {
                                for (let j = 0; j < 2; j++) {
                                    const bug = { ...EnemyTypes.BUG };
                                    bug.x = e.x + (j === 0 ? -30 : 30);
                                    bug.y = e.y;
                                    bug.health = bug.maxHealth;
                                    enemies.push(bug);
                                }
                            }
                            
                            return false;
                        }
                        break;
                    }
                }
                
                // Check collision with player
                if (!player.invincible) {
                    const dx = player.x - e.x;
                    const dy = player.y - e.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < e.width / 2 + player.width / 2 - 10) {
                        if (player.shield) {
                            player.shield = false;
                            player.shieldTimer = 0;
                        } else {
                            player.health -= 30;
                            screenShake = 15;
                            screenFlash = 0.2;
                            screenFlashColor = COLORS.secondary;
                            createExplosion(e.x, e.y, e.color, true);
                            playSound('explosion');
                            
                            if (player.health <= 0) {
                                player.lives--;
                                if (player.lives <= 0) {
                                    gameState = GameState.GAMEOVER;
                                    createExplosion(player.x, player.y, COLORS.primary, true);
                                    if (score > highScore) {
                                        highScore = score;
                                        localStorage.setItem('neonShooterHighScore', highScore);
                                    }
                                } else {
                                    player.health = player.maxHealth;
                                    player.invincible = true;
                                    player.invincibleTimer = 2;
                                    createExplosion(player.x, player.y, COLORS.accent, true);
                                }
                            }
                        }
                        return false;
                    }
                }
                
                // Remove if off screen
                return e.y < BASE_HEIGHT + 100;
            });
        }
        
        function updatePowerups(dt) {
            powerups = powerups.filter(p => {
                p.y += 60 * dt;
                p.life -= dt;
                p.glow = (Math.sin(p.life * 10) + 1) * 0.5;
                
                // Check collision with player
                const dx = p.x - player.x;
                const dy = p.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < p.size + player.width / 2) {
                    playSound('powerup');
                    createParticle(p.x, p.y, COLORS.neonYellow, 20, 120, 0.4);
                    screenFlash = 0.1;
                    screenFlashColor = COLORS.neonYellow;
                    
                    switch (p.type) {
                        case 'shield':
                            player.shield = true;
                            player.shieldTimer = 10;
                            break;
                        case 'rapidfire':
                            player.rapidFire = true;
                            player.rapidFireTimer = 8;
                            break;
                        case 'bomb':
                            // Clear all enemies
                            enemies.forEach(e => {
                                score += Math.floor(e.points / 2);
                                createExplosion(e.x, e.y, e.color, false);
                            });
                            enemies = [];
                            enemyBullets = [];
                            screenShake = 25;
                            playSound('explosion');
                            break;
                        case 'life':
                            player.lives++;
                            player.health = Math.min(player.health + 30, player.maxHealth);
                            break;
                    }
                    
                    return false;
                }
                
                return p.life > 0 && p.y < BASE_HEIGHT + 30;
            });
        }
        
        function updateParticles(dt) {
            particles = particles.filter(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.life -= dt;
                p.vx *= 0.98;
                p.vy *= 0.98;
                return p.life > 0;
            });
            
            explosions = explosions.filter(e => {
                e.life -= dt;
                e.radius += (e.maxRadius / e.maxLife) * dt;
                return e.life > 0;
            });
        }
        
        function updateWaves(dt) {
            waveTimer += dt;
            
            // Calculate enemies for current wave
            waveEnemiesTotal = 8 + wave * 3;
            
            // Spawn enemies
            if (waveEnemiesSpawned < waveEnemiesTotal && enemies.length < 10) {
                if (waveTimer > 1.5 - Math.min(wave * 0.1, 1)) {
                    waveTimer = 0;
                    
                    const rand = Math.random();
                    if (rand < 0.4) {
                        spawnEnemy(EnemyTypes.BUG);
                    } else if (rand < 0.7) {
                        spawnEnemy(EnemyTypes.SQUID);
                    } else {
                        spawnEnemy(EnemyTypes.CRUISER);
                    }
                    
                    waveEnemiesSpawned++;
                }
            }
            
            // Boss every 5 waves
            if (wave % 5 === 0 && waveEnemiesSpawned >= waveEnemiesTotal && enemies.length === 0) {
                if (!enemies.some(e => e.name === 'boss')) {
                    spawnBoss();
                }
            }
            
            // Next wave
            if (waveEnemiesSpawned >= waveEnemiesTotal && enemies.length === 0 && wave % 5 !== 0) {
                wave++;
                waveEnemiesSpawned = 0;
                waveTimer = 0;
                player.health = Math.min(player.health + 20, player.maxHealth);
            }
            
            // Win condition (wave 20 boss defeated)
            if (wave >= 20 && wave % 5 === 0 && enemies.length === 0 && waveEnemiesSpawned >= waveEnemiesTotal) {
                gameState = GameState.WIN;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('neonShooterHighScore', highScore);
                }
            }
        }
        
        function updateStars(dt) {
            stars.forEach(s => {
                s.y += s.speed * dt;
                if (s.y > BASE_HEIGHT) {
                    s.y = 0;
                    s.x = Math.random() * BASE_WIDTH;
                }
            });
        }
        
        // Draw functions
        function drawBackground() {
            // Draw asset background with cover
            if (assetsLoaded.background) {
                drawCover(assets.background, 0, 0, BASE_WIDTH, BASE_HEIGHT);
            } else {
                // Fallback gradient
                const grad = ctx.createLinearGradient(0, 0, 0, BASE_HEIGHT);
                grad.addColorStop(0, '#0a0a12');
                grad.addColorStop(0.5, '#0d1117');
                grad.addColorStop(1, '#151525');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            }
            
            // Draw stars
            stars.forEach(s => {
                ctx.save();
                ctx.globalAlpha = s.brightness * (0.5 + Math.sin(Date.now() * 0.001 + s.x) * 0.5);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }
        
        function drawPlayer() {
            if (player.invincible && Math.floor(Date.now() / 100) % 2 === 0) return;
            
            // Draw trail
            player.trail.forEach((t, i) => {
                const alpha = (1 - i / player.trail.length) * 0.3;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = COLORS.accent;
                ctx.shadowBlur = 10;
                ctx.shadowColor = COLORS.accent;
                ctx.beginPath();
                ctx.ellipse(t.x, t.y, 15 - i, 10 - i * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Shield
            if (player.shield) {
                ctx.strokeStyle = COLORS.neonBlue;
                ctx.shadowBlur = 20;
                ctx.shadowColor = COLORS.neonBlue;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.stroke();
                
                // Shield glow
                const shieldGrad = ctx.createRadialGradient(0, 0, 20, 0, 0, 40);
                shieldGrad.addColorStop(0, 'rgba(0, 255, 255, 0)');
                shieldGrad.addColorStop(0.5, 'rgba(0, 255, 255, 0.1)');
                shieldGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
                ctx.fillStyle = shieldGrad;
                ctx.fill();
            }
            
            // Main body (organic shape)
            ctx.fillStyle = COLORS.primary;
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.primary;
            
            // Cockpit
            ctx.beginPath();
            ctx.ellipse(0, -5, 12, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Wings
            ctx.beginPath();
            ctx.moveTo(-25, 10);
            ctx.quadraticCurveTo(-30, 0, -20, -5);
            ctx.quadraticCurveTo(-15, 0, -15, 15);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(25, 10);
            ctx.quadraticCurveTo(30, 0, 20, -5);
            ctx.quadraticCurveTo(15, 0, 15, 15);
            ctx.closePath();
            ctx.fill();
            
            // Engine glow
            ctx.fillStyle = COLORS.accent;
            ctx.shadowColor = COLORS.accent;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.ellipse(-10, 18, 5, 8 + Math.sin(Date.now() * 0.02) * 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(10, 18, 5, 8 + Math.sin(Date.now() * 0.02 + 1) * 3, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw sprite if available
            if (assetsLoaded.sprites) {
                ctx.drawImage(assets.sprites, 50, 50, 50, 40, -25, -20, 50, 40);
            }
            
            ctx.restore();
        }
        
        function drawEnemies() {
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                
                ctx.fillStyle = e.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = e.color;
                
                switch (e.name) {
                    case 'bug':
                        // Bug body (ellipse with legs)
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Legs
                        ctx.strokeStyle = e.color;
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 3; i++) {
                            const angle = (i - 1) * 0.4 + Math.sin(e.phase + i) * 0.2;
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(Math.cos(angle) * 25, Math.sin(angle) * 25);
                            ctx.stroke();
                        }
                        
                        // Eyes
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(-5, -3, 3, 0, Math.PI * 2);
                        ctx.arc(5, -3, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                        
                    case 'squid':
                        // Squid body
                        ctx.beginPath();
                        ctx.ellipse(0, 0, 17, 15, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Tentacles
                        for (let i = 0; i < 4; i++) {
                            const angle = Math.PI / 2 + (i - 1.5) * 0.3 + Math.sin(e.phase + i) * 0.2;
                            ctx.beginPath();
                            ctx.moveTo(0, 10);
                            ctx.quadraticCurveTo(
                                Math.cos(angle) * 15,
                                15 + Math.sin(e.phase + i) * 5,
                                Math.cos(angle) * 20,
                                25
                            );
                            ctx.strokeStyle = e.color;
                            ctx.lineWidth = 3;
                            ctx.stroke();
                        }
                        
                        // Eyes
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(-6, -2, 4, 0, Math.PI * 2);
                        ctx.arc(6, -2, 4, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                        
                    case 'cruiser':
                        // Cruiser main body
                        ctx.beginPath();
                        ctx.moveTo(0, -20);
                        ctx.lineTo(25, 10);
                        ctx.quadraticCurveTo(25, 20, 15, 20);
                        ctx.lineTo(-15, 20);
                        ctx.quadraticCurveTo(-25, 20, -25, 10);
                        ctx.closePath();
                        ctx.fill();
                        
                        // Bridge
                        ctx.fillRect(-8, -10, 16, 15);
                        
                        // Guns
                        ctx.fillRect(-20, 5, 8, 15);
                        ctx.fillRect(12, 5, 8, 15);
                        
                        // Lights
                        ctx.fillStyle = '#fff';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(0, -15, 3, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                        
                    case 'boss':
                        // Boss main body
                        const bossGrad = ctx.createLinearGradient(0, -40, 0, 40);
                        bossGrad.addColorStop(0, e.color);
                        bossGrad.addColorStop(1, COLORS.secondary);
                        ctx.fillStyle = bossGrad;
                        
                        ctx.beginPath();
                        ctx.moveTo(0, -40);
                        ctx.bezierCurveTo(60, -30, 60, 30, 40, 40);
                        ctx.lineTo(-40, 40);
                        ctx.bezierCurveTo(-60, 30, -60, -30, 0, -40);
                        ctx.fill();
                        
                        // Wings
                        ctx.fillStyle = COLORS.secondary;
                        ctx.beginPath();
                        ctx.moveTo(-50, 0);
                        ctx.lineTo(-80, 30);
                        ctx.lineTo(-60, 35);
                        ctx.lineTo(-40, 20);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.beginPath();
                        ctx.moveTo(50, 0);
                        ctx.lineTo(80, 30);
                        ctx.lineTo(60, 35);
                        ctx.lineTo(40, 20);
                        ctx.closePath();
                        ctx.fill();
                        
                        // Guns
                        ctx.fillStyle = COLORS.accent;
                        for (let i = -2; i <= 2; i++) {
                            ctx.beginPath();
                            ctx.arc(i * 15, 35, 6, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        
                        // Eye
                        ctx.fillStyle = '#fff';
                        ctx.shadowColor = '#fff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(0, 0, 15, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = COLORS.secondary;
                        ctx.beginPath();
                        ctx.arc(0, 0, 8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // Health bar for boss
                        const healthPercent = e.health / e.maxHealth;
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillRect(-50, -55, 100, 10);
                        ctx.fillStyle = COLORS.primary;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = COLORS.primary;
                        ctx.fillRect(-50, -55, 100 * healthPercent, 10);
                        break;
                }
                
                ctx.restore();
            });
        }
        
        function drawBullets() {
            // Player bullets
            bullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowBlur = b.glow;
                ctx.shadowColor = b.color;
                
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Inner glow
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
            
            // Enemy bullets
            enemyBullets.forEach(b => {
                ctx.save();
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = b.color;
                
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });

        function drawPowerups() {
            powerups.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                
                const glow = 10 + p.glow * 10;
                
                // Outer glow
                ctx.shadowBlur = glow;
                ctx.strokeStyle = COLORS.neonYellow;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, p.size + 5, 0, Math.PI * 2);
                ctx.stroke();
                
                // Background
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, p.size);
                grad.addColorStop(0, COLORS.neonYellow);
                grad.addColorStop(1, 'rgba(255, 255, 0, 0.3)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Icon
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                switch (p.type) {
                    case 'shield':
                        ctx.fillText('🛡', 0, 0);

                    case 'rapidfire':
                        ctx.fillText('⚡', 0, 0);
                        break;
                    case 'bomb':
                        ctx.fillText('💣', 0, 0);
                        break;
                    case 'life':
                        ctx.fillText('❤', 0, 0);
                        break;
                }
                
                ctx.restore();
            });
        }
        
        function drawParticles() {
            particles.forEach(p => {
                const alpha = p.life / p.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
            
            // Explosions
            explosions.forEach(e => {
                const alpha = e.life / e.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha * 0.5;
                
                const grad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
                grad.addColorStop(0, '#fff');
                grad.addColorStop(0.3, e.color);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
        }

            }
            
            ctx.fillStyle = COLORS.accent;
            ctx.font = '20px "Segoe UI", Arial, sans-serif';
            ctx.shadowBlur = 10;
            const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Нажмите ПРОБЕЛ для рестарта', BASE_WIDTH / 2, BASE_HEIGHT / 2 + 100);
            ctx.restore();
        }
        
        function drawWin() {
            ctx.save();
            ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
            ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
            
            ctx.fillStyle = COLORS.neonYellow;
            ctx.font = 'bold 56px "Segoe UI", Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 30;
            ctx.shadowColor = COLORS.neonYellow;
            ctx.fillText('ПОБЕДА!', BASE_WIDTH / 2, BASE_HEIGHT / 2 - 80);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = '28px "Segoe UI", Arial, sans-serif';
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.text;
            ctx.fillText('Вы прошли все 20 волн!', BASE_WIDTH / 2, BASE_HEIGHT / 2 - 10);
            ctx.fillText('ФИНАЛЬНЫЙ СЧЁТ: ' + score.toLocaleString(), BASE_WIDTH / 2, BASE_HEIGHT / 2 + 35);
            
            ctx.fillStyle = COLORS.accent;
            ctx.font = '20px "Segoe UI", Arial, sans-serif';
            ctx.shadowBlur = 10;
            const pulse = Math.sin(Date.now() * 0.005) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillText('Нажмите ПРОБЕЛ для новой игры', BASE_WIDTH / 2, BASE_HEIGHT / 2 + 100);
            ctx.restore();
        }
        
        // Main game loop
        let lastTime = 0;
        
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            
            // Apply scale
            ctx.save();
            ctx.scale(scale, scale);
            
            // Update
            updateStars(dt);
            
            if (gameState === GameState.PLAYING) {
                updatePlayer(dt);
                updateBullets(dt);
                updateEnemies(dt);
                updatePowerups(dt);
                updateWaves(dt);
                updateParticles(dt);
                
                // Screen shake decay
                if (screenShake > 0) {
                    screenShake *= 0.9;
                    if (screenShake < 0.5) screenShake = 0;
                }
                
                // Screen flash decay
                if (screenFlash > 0) {
                    screenFlash -= dt * 5;
                    if (screenFlash < 0) screenFlash = 0;
                }
            } else {
                updateParticles(dt);
            }
            
            // Draw
            ctx.save();
            
            // Screen shake
            if (screenShake > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * screenShake,
                    (Math.random() - 0.5) * screenShake
                );
            }
            
            if (gameState === GameState.MENU) {
                drawMenu();
            } else {
                drawBackground();
                drawPowerups();
                drawBullets();
                drawEnemies();
                drawPlayer();
                drawParticles();
                drawHUD();
                
                // Screen flash
                if (screenFlash > 0) {
                    ctx.fillStyle = screenFlashColor;
                    ctx.globalAlpha = screenFlash * 0.3;
                    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
                    ctx.globalAlpha = 1;
                }
                
                if (gameState === GameState.PAUSED) {
                    drawPaused();
                } else if (gameState === GameState.GAMEOVER) {
                    drawGameOver();
                } else if (gameState === GameState.WIN) {
                    drawWin();
                }
            }
            
            ctx.restore();
            ctx.restore();
            
            requestAnimationFrame(gameLoop);
        }
        
        // Start
        requestAnimationFrame(gameLoop);
        
    })();
    </script>
</body>
</html>
