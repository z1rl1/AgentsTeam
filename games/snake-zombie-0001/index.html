<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Змейка: Зомби</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #ui { color: #5a8f3a; text-align: center; margin-bottom: 10px; }
    #score { font-size: 24px; letter-spacing: 4px; color: #5a8f3a; }
    #message { font-size: 14px; color: #8f5a2a; margin-top: 8px; }
    canvas {
      border: 3px solid #3d5c1f;
      display: block;
      box-shadow: 0 0 30px rgba(90,143,58,0.3);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">ЗОМБИ: 0</div>
    <div id="message">Нажми Enter для начала</div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let gameState = 'START';
    let score = 0;
    let highScore = 0;
    let animationId = null;
    let lastTime = 0;
    const TICK = 120;
    let lastTick = 0;

    const GRID = 20;
    let cols, rows, cellSize;

    function resizeCanvas() {
      const size = Math.min(window.innerWidth - 40, window.innerHeight - 120, 560);
      canvas.width = size;
      canvas.height = size;
      cols = GRID;
      rows = GRID;
      cellSize = size / GRID;
    }

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let bloodDrops = [];

    function initGame() {
      const startX = Math.floor(cols / 2);
      const startY = Math.floor(rows / 2);
      snake = [
        { x: startX, y: startY },
        { x: startX - 1, y: startY },
        { x: startX - 2, y: startY }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      bloodDrops = [];
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * cols);
        food.y = Math.floor(Math.random() * rows);
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    function addBlood(x, y) {
      for (let i = 0; i < 6; i++) {
        bloodDrops.push({
          x: x * cellSize + cellSize / 2,
          y: y * cellSize + cellSize / 2,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 40 + Math.random() * 20,
          size: 2 + Math.random() * 3
        });
      }
    }

    function updateBlood() {
      bloodDrops = bloodDrops.filter(b => {
        b.x += b.vx;
        b.y += b.vy;
        b.vy += 0.1;
        b.life--;
        return b.life > 0;
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      direction = { ...nextDirection };

      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
        gameOver();
        return;
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        addBlood(food.x, food.y);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function drawZombieCell(x, y, color, isHead) {
      const px = x * cellSize;
      const py = y * cellSize;

      if (isHead) {
        ctx.fillStyle = '#4a7a22';
        ctx.fillRect(px + 1, py + 1, cellSize - 2, cellSize - 2);

        ctx.fillStyle = '#2d4a12';
        const eyeSize = cellSize * 0.2;
        ctx.fillRect(px + cellSize * 0.2, py + cellSize * 0.3, eyeSize, eyeSize);
        ctx.fillRect(px + cellSize * 0.6, py + cellSize * 0.3, eyeSize, eyeSize);

        ctx.fillStyle = '#8f2222';
        ctx.fillRect(px + cellSize * 0.25 + Math.random() * 2, py + cellSize * 0.5, cellSize * 0.15, cellSize * 0.1);
        ctx.fillRect(px + cellSize * 0.55 + Math.random() * 2, py + cellSize * 0.5, cellSize * 0.15, cellSize * 0.1);
      } else {
        ctx.fillStyle = color;
        ctx.fillRect(px + 2, py + 2, cellSize - 4, cellSize - 4);
      }
    }

    function drawFood() {
      const px = food.x * cellSize;
      const py = food.y * cellSize;
      ctx.fillStyle = '#aa2222';
      ctx.fillRect(px + 2, py + 2, cellSize - 4, cellSize - 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(px + cellSize * 0.3, py + cellSize * 0.3, cellSize * 0.2, cellSize * 0.2);
    }

    function drawBlood() {
      bloodDrops.forEach(b => {
        ctx.fillStyle = `rgba(120, 20, 20, ${b.life / 60})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function render() {
      ctx.fillStyle = '#0d1a05';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
          ctx.strokeStyle = '#1a2d0a';
          ctx.strokeRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }
      }

      if (gameState === 'START') {
        drawStartScreen();
      } else if (gameState === 'PLAYING' || gameState === 'GAME_OVER') {
        drawZombieCell(snake[0].x, snake[0].y, '#4a7a22', true);
        for (let i = 1; i < snake.length; i++) {
          const shade = Math.floor(60 + (i / snake.length) * 40);
          const color = `rgb(${shade}, ${Math.floor(shade * 0.8)}, ${Math.floor(shade * 0.4)})`;
          drawZombieCell(snake[i].x, snake[i].y, color, false);
        }
        drawFood();
        drawBlood();
        drawScore();

        if (gameState === 'GAME_OVER') {
          drawGameOverScreen();
        }
      }
    }

    function drawStartScreen() {
      ctx.fillStyle = '#3d5c1f';
      ctx.font = 'bold 36px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('🐛 ЗОМБИ ЗМЕЙКА 🐛', canvas.width / 2, canvas.height / 2 - 50);

      ctx.fillStyle = '#5a8f3a';
      ctx.font = '16px Courier New';
      ctx.fillText('Уничтожай зомби и становись сильнее!', canvas.width / 2, canvas.height / 2);
      ctx.fillText('Enter / Пробел — старт', canvas.width / 2, canvas.height / 2 + 40);

      ctx.fillStyle = '#8f5a2a';
      ctx.font = '12px Courier New';
      ctx.fillText('Управление: стрелки', canvas.width / 2, canvas.height / 2 + 80);
    }

    function drawGameOverScreen() {
      ctx.fillStyle = 'rgba(10, 5, 0, 0.85)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#8f2222';
      ctx.font = 'bold 40px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('МЕРТВ...', canvas.width / 2, canvas.height / 2 - 50);

      ctx.fillStyle = '#aa3333';
      ctx.font = '22px Courier New';
      ctx.fillText('Зомби убиты: ' + score, canvas.width / 2, canvas.height / 2);

      ctx.fillStyle = '#5a8f3a';
      ctx.font = '18px Courier New';
      ctx.fillText('Рекорд: ' + highScore, canvas.width / 2, canvas.height / 2 + 40);

      ctx.fillStyle = '#8f5a2a';
      ctx.font = '14px Courier New';
      ctx.fillText('Enter — воскреснуть', canvas.width / 2, canvas.height / 2 + 85);
    }

    function drawScore() {
      document.getElementById('score').textContent = 'ЗОМБИ: ' + score;
    }

    function gameOver() {
      gameState = 'GAME_OVER';
      if (score > highScore) highScore = score;
      document.getElementById('message').textContent = 'Enter — воскреснуть';
    }

    function startGame() {
      score = 0;
      gameState = 'PLAYING';
      initGame();
    }

    function gameLoop(timestamp) {
      if (timestamp - lastTick >= TICK) {
        update();
        updateBlood();
        lastTick = timestamp;
      }
      render();
      animationId = requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        if (gameState === 'START' || gameState === 'GAME_OVER') {
          startGame();
          return;
        }
      }
      if (gameState === 'PLAYING') {
        switch (e.key) {
          case 'ArrowUp':
            if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
            break;
          case 'ArrowDown':
            if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
            break;
          case 'ArrowLeft':
            if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
            break;
          case 'ArrowRight':
            if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
            break;
        }
      }
    });

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      if (gameState !== 'PLAYING') startGame();
    });
    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
        else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
      } else {
        if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
        else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
      }
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    initGame();
    render();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
