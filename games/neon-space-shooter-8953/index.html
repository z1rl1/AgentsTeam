<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d1117;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const WIDTH = 960;
        const HEIGHT = 540;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        
        const COLORS = {
            bg: '#0d1117',
            primary: '#ff4444',
            secondary: '#cc0000',
            accent: '#ff6666',
            text: '#ffffff',
            cyan: '#00ffff',
            green: '#00ff88',
            gold: '#ffcc00'
        };
        
        let assets = {
            background: null,
            sprites: null,
            title: null
        };
        
        let loadCount = 0;
        function loadImage(src, name) {
            const img = new Image();
            img.onload = () => {
                assets[name] = img;
                loadCount++;
            };
            img.onerror = () => {
                console.log('Asset not found:', src);
                loadCount++;
            };
            img.src = src;
        }
        
        loadImage('assets/background.png', 'background');
        loadImage('assets/sprites.png', 'sprites');
        loadImage('assets/title.png', 'title');
        
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            switch(type) {
                case 'shoot':
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'explosion':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'pickup':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'hit':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                    break;
            }
        }
        
        const STAR_COUNT = 100;
        let stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.2,
                brightness: Math.random()
            });
        }
        
        class Particle {
            constructor(x, y, color, size, vx, vy, life) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.vx = vx;
                this.vy = vy;
                this.life = life;
                this.maxLife = life;
                this.alive = true;
            }
            
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.life -= dt;
                if (this.life <= 0) this.alive = false;
            }
            
            draw() {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        let particles = [];
        
        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 150 + 50;
                particles.push(new Particle(
                    x, y, color,
                    Math.random() * 4 + 2,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    Math.random() * 0.5 + 0.3
                ));
            }
        }
        
        let screenShake = 0;
        
        class Player {
            constructor() {
                this.x = WIDTH / 2;
                this.y = HEIGHT - 80;
                this.width = 48;
                this.height = 48;
                this.speed = 350;
                this.health = 100;
                this.maxHealth = 100;
                this.lives = 3;
                this.score = 0;
                this.shootCooldown = 0;
                this.shootRate = 0.15;
                this.shield = 0;
                this.speedBoost = 0;
                this.invincible = 0;
            }
            
            update(dt, keys) {
                const moveSpeed = this.speed * (1 + this.speedBoost * 0.5);
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= moveSpeed * dt;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += moveSpeed * dt;
                if (keys['ArrowUp'] || keys['KeyW']) this.y -= moveSpeed * dt;
                if (keys['ArrowDown'] || keys['KeyS']) this.y += moveSpeed * dt;
                
                this.x = Math.max(this.width / 2, Math.min(WIDTH - this.width / 2, this.x));
                this.y = Math.max(this.height / 2, Math.min(HEIGHT - this.height / 2, this.y));
                
                this.shootCooldown -= dt;
                if ((keys['Space'] || keys['KeyX']) && this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = this.shootRate;
                }
                
                if (this.shield > 0) this.shield -= dt;
                if (this.speedBoost > 0) this.speedBoost -= dt;
                if (this.invincible > 0) this.invincible -= dt;
            }
            
            shoot() {
                playSound('shoot');
                bullets.push(new Bullet(this.x, this.y - this.height / 2, 0, -600, 1));
                if (this.speedBoost > 0) {
                    bullets.push(new Bullet(this.x - 15, this.y - this.height / 2, 0, -600, 1));
                    bullets.push(new Bullet(this.x + 15, this.y - this.height / 2, 0, -600, 1));
                }
            }
            
            takeDamage(amount) {
                if (this.invincible > 0 || this.shield > 0) return;
                this.health -= amount;
                this.invincible = 1;
                screenShake = 0.3;
                playSound('hit');
                createExplosion(this.x, this.y, COLORS.primary, 8);
                
                if (this.health <= 0) {
                    this.lives--;
                    if (this.lives > 0) {
                        this.health = this.maxHealth;
                        this.x = WIDTH / 2;
                        this.y = HEIGHT - 80;
                        this.invincible = 2;
                    }
                }
            }
            
            draw() {
                ctx.save();
                
                if (this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = COLORS.cyan;
                
                if (assets.sprites) {
                    ctx.drawImage(assets.sprites, 0, 0, 48, 48, this.x - 24, this.y - 24, 48, 48);
                } else {
                    this.drawFallbackShip();
                }
                
                if (this.shield > 0) {
                    ctx.strokeStyle = COLORS.cyan;
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = COLORS.cyan;
                    ctx.beginPath();
                    ctx.ellipse(this.x, this.y, 35, 35, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                if (this.speedBoost > 0) {
                    ctx.fillStyle = COLORS.gold;
                    ctx.shadowColor = COLORS.gold;
                    ctx.shadowBlur = 10;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.ellipse(
                            this.x + (i - 1) * 15,
                            this.y + 30,
                            5, 8,
                            0, 0, Math.PI * 2
                        );
                        ctx.fill();
                    }
                }
                
                ctx.restore();
            }
            
            drawFallbackShip() {
                ctx.fillStyle = COLORS.cyan;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - 24);
                ctx.bezierCurveTo(this.x + 25, this.y - 10, this.x + 25, this.y + 10, this.x + 15, this.y + 20);
                ctx.lineTo(this.x - 15, this.y + 20);
                ctx.bezierCurveTo(this.x - 25, this.y + 10, this.x - 25, this.y - 10, this.x);
                ctx.fill();
                
                ctx.fillStyle = COLORS.primary;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + 5, 8, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = COLORS.accent;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + 20, 4, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        class Bullet {
            constructor(x, y, vx, vy, damage, isEnemy = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.damage = damage;
                this.isEnemy = isEnemy;
                this.radius = isEnemy ? 5 : 4;
                this.alive = true;
            }
            
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                if (this.y < -20 || this.y > HEIGHT + 20 || this.x < -20 || this.x > WIDTH + 20) {
                    this.alive = false;
                }
            }
            
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.isEnemy ? COLORS.primary : COLORS.cyan;
                ctx.fillStyle = this.isEnemy ? COLORS.primary : COLORS.cyan;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = this.isEnemy ? COLORS.accent : '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        let bullets = [];
        
        class Enemy {
            constructor(type, x, y) {
                this.type = type;
                this.x = x;
                this.y = y;
                this.alive = true;
                this.shootCooldown = Math.random() * 2 + 1;
                
                switch(type) {
                    case 'bug':
                        this.width = 36;
                        this.height = 36;
                        this.health = 20;
                        this.speed = 80;
                        this.score = 100;
                        this.color = '#88ff88';
                        this.shootRate = 3;
                        break;
                    case 'squid':
                        this.width = 40;
                        this.height = 40;
                        this.health = 35;
                        this.speed = 60;
                        this.score = 150;
                        this.color = '#ff88ff';
                        this.shootRate = 2;
                        this.amplitude = 50;
                        this.phase = Math.random() * Math.PI * 2;
                        break;
                    case 'cruiser':
                        this.width = 56;
                        this.height = 48;
                        this.health = 60;
                        this.speed = 40;
                        this.score = 250;
                        this.color = '#8888ff';
                        this.shootRate = 1.5;
                        this.canShoot = true;
                        break;
                    case 'boss':
                        this.width = 120;
                        this.height = 100;
                        this.health = 500;
                        this.maxHealth = 500;
                        this.speed = 100;
                        this.score = 2000;
                        this.color = '#ff4444';
                        this.shootRate = 0.8;
                        this.phase = 0;
                        this.canShoot = true;
                        break;
                }
                
                this.startX = x;
            }
            
            update(dt) {
                switch(this.type) {
                    case 'bug':
                        this.y += this.speed * dt;
                        this.x += Math.sin(this.y * 0.05) * 50 * dt;
                        break;
                    case 'squid':
                        this.y += this.speed * dt;
                        this.x = this.startX + Math.sin(this.phase + this.y * 0.02) * this.amplitude;
                        break;
                    case 'cruiser':
                        if (this.y < 100) {
                            this.y += this.speed * dt;
                        } else {
                            this.x += Math.sin(game.time * 0.5) * 30 * dt;
                        }
                        break;
                    case 'boss':
                        if (this.y > 80) {
                            this.y -= this.speed * dt;
                        } else {
                            this.x += Math.sin(this.phase) * 100 * dt;
                            this.phase += dt;
                            if (this.x < 100) this.phase = 0;
                            if (this.x > WIDTH - 100) this.phase = Math.PI;
                        }
                        break;
                }
                
                this.shootCooldown -= dt;
                if (this.canShoot && this.shootCooldown <= 0 && this.y > 0) {
                    this.shoot();
                    this.shootCooldown = this.shootRate;
                }
                
                if (this.y > HEIGHT + 50) this.alive = false;
            }
            
            shoot() {
                if (this.type === 'boss') {
                    for (let i = -2; i <= 2; i++) {
                        bullets.push(new Bullet(this.x + i * 20, this.y + this.height / 2, i * 50, 250, 15, true));
                    }
                } else {
                    bullets.push(new Bullet(this.x, this.y + this.height / 2, 0, 250, 10, true));
                }
            }
            
            takeDamage(amount) {
                this.health -= amount;
                createExplosion(this.x, this.y, this.color, 5);
                playSound('hit');
                
                if (this.health <= 0) {
                    this.alive = false;
                    player.score += this.score;
                    playSound('explosion');
                    createExplosion(this.x, this.y, this.color, 25);
                    screenShake = 0.2;
                }
            }
            
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                
                if (assets.sprites) {
                    let sx = 0, sy = 0;
                    switch(this.type) {
                        case 'bug': sx = 48; sy = 0; break;
                        case 'squid': sx = 96; sy = 0; break;
                        case 'cruiser': sx = 144; sy = 0; break;
                        case 'boss': sx = 200; sy = 0; break;
                    }
                    ctx.drawImage(assets.sprites, sx, sy, this.width, this.height, 
                                  this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                } else {
                    this.drawFallback();
                }
                
                if (this.type === 'boss') {
                    const barWidth = 200;
                    const barHeight = 10;
                    const healthPercent = this.health / this.maxHealth;
                    
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(this.x - barWidth / 2, this.y - 70, barWidth, barHeight);
                    
                    const gradient = ctx.createLinearGradient(this.x - barWidth / 2, 0, this.x + barWidth / 2, 0);
                    gradient.addColorStop(0, COLORS.primary);
                    gradient.addColorStop(1, COLORS.accent);
                    ctx.fillStyle = gradient;
                    ctx.fillRect(this.x - barWidth / 2, this.y - 70, barWidth * healthPercent, barHeight);
                }
                
                ctx.restore();
            }
            
            drawFallback() {
                ctx.fillStyle = this.color;
                
                switch(this.type) {
                    case 'bug':
                        ctx.beginPath();
                        ctx.ellipse(this.x, this.y, 18, 14, 0, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#ffaa00';
                        ctx.beginPath();
                        ctx.arc(this.x - 10, this.y - 8, 5, 0, Math.PI * 2);
                        ctx.arc(this.x + 10, this.y - 8, 5, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.strokeStyle = this.color;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x - 15, this.y + 10);
                        ctx.lineTo(this.x - 20, this.y + 20);
                        ctx.moveTo(this.x + 15, this.y + 10);
                        ctx.lineTo(this.x + 20, this.y + 20);
                        ctx.stroke();
                        break;
                        
                    case 'squid':
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y - 20);
                        ctx.bezierCurveTo(this.x + 25, this.y - 10, this.x + 25, this.y + 15, this.x, this.y + 20);
                        ctx.bezierCurveTo(this.x - 25, this.y + 15, this.x - 25, this.y - 10, this.x);
                        ctx.fill();
                        
                        ctx.fillStyle = '#ff00ff';
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI + Math.PI / 2;
                            ctx.beginPath();
                            ctx.ellipse(
                                this.x + Math.cos(angle) * 15,
                                this.y + 15 + Math.sin(angle) * 8,
                                4, 10, angle, 0, Math.PI * 2
                            );
                            ctx.fill();
                        }
                        break;
                        
                    case 'cruiser':
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y - 24);
                        ctx.lineTo(this.x + 28, this.y);
                        ctx.lineTo(this.x + 20, this.y + 24);
                        ctx.lineTo(this.x - 20, this.y + 24);
                        ctx.lineTo(this.x - 28, this.y);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.fillStyle = COLORS.secondary;
                        ctx.fillRect(this.x - 15, this.y - 5, 30, 10);
                        break;
                        
                    case 'boss':
                        ctx.beginPath();
                        ctx.moveTo(this.x, this.y - 50);
                        ctx.lineTo(this.x + 60, this.y);
                        ctx.lineTo(this.x + 50, this.y + 50);
                        ctx.lineTo(this.x - 50, this.y + 50);
                        ctx.lineTo(this.x - 60, this.y);
                        ctx.closePath();
                        ctx.fill();
                        
                        ctx.fillStyle = COLORS.gold;
                        ctx.beginPath();
                        ctx.arc(this.x - 25, this.y - 10, 15, 0, Math.PI * 2);
                        ctx.arc(this.x + 25, this.y - 10, 15, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(this.x - 25, this.y - 10, 8, 0, Math.PI * 2);
                        ctx.arc(this.x + 25, this.y - 10, 8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = COLORS.accent;
                        ctx.fillRect(this.x - 40, this.y + 20, 80, 15);
                        break;
                }
            }
        }
        
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.radius = 15;
                this.alive = true;
                this.bobPhase = Math.random() * Math.PI * 2;
                
                switch(type) {
                    case 'shield':
                        this.color = COLORS.cyan;
                        this.symbol = 'S';
                        break;
                    case 'speed':
                        this.color = COLORS.gold;
                        this.symbol = '>';
                        break;
                    case 'bomb':
                        this.color = '#ff8800';
                        this.symbol = 'B';
                        break;
                    case 'life':
                        this.color = '#ff4488';
                        this.symbol = '+';
                        break;
                }
            }
            
            update(dt) {
                this.y += 80 * dt;
                this.bobPhase += dt * 3;
                
                if (this.y > HEIGHT + 30) this.alive = false;
            }
            
            draw() {
                const bobY = Math.sin(this.bobPhase) * 5;
                
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y + bobY, this.radius, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.symbol, this.x, this.y + bobY);
                
                ctx.restore();
            }
            
            apply(player) {
                playSound('pickup');
                createExplosion(this.x, this.y, this.color, 12);
                
                switch(this.type) {
                    case 'shield':
                        player.shield = 10;
                        break;
                    case 'speed':
                        player.speedBoost = 8;
                        break;
                    case 'bomb':
                        for (let i = enemies.length - 1; i >= 0; i--) {
                            if (enemies[i].type !== 'boss') {
                                enemies[i].takeDamage(100);
                            }
                        }
                        screenShake = 0.5;
                        createExplosion(player.x, player.y, '#ff8800', 30);
                        break;
                    case 'life':
                        player.lives++;
                        player.health = Math.min(player.health + 30, player.maxHealth);
                        break;
                }
            }
        }
        
        let enemies = [];
        let powerUps = [];
        let player = null;
        
        const game = {
            state: 'menu',
            time: 0,
            wave: 1,
            enemiesInWave: 0,
            enemiesSpawned: 0,
            spawnTimer: 0,
            waveDelay: 0
        };
        
        let keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') e.preventDefault();
            
            if (game.state === 'menu' && (e.code === 'Space' || e.code === 'Enter')) {
                initAudio();
                startGame();
            }
            if (game.state === 'gameover' && (e.code === 'Space' || e.code === 'Enter')) {
                initAudio();
                startGame();
            }
            if (game.state === 'win' && (e.code === 'Space' || e.code === 'Enter')) {
                initAudio();
                startGame();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
        
        function startGame() {
            player = new Player();
            enemies = [];
            bullets = [];
            powerUps = [];
            particles = [];
            game.state = 'playing';
            game.wave = 1;
            game.time = 0;
            game.enemiesSpawned = 0;
            game.spawnTimer = 0;
            game.waveDelay = 0;
        }
        
        function spawnEnemy() {
            const x = Math.random() * (WIDTH - 100) + 50;
            let type;
            const rand = Math.random();
            
            if (game.wave >= 5 && game.wave % 5 === 0 && game.enemiesSpawned === game.enemiesInWave - 1) {
                type = 'boss';
            } else if (rand < 0.4) {
                type = 'bug';
            } else if (rand < 0.7) {
                type = 'squid';
            } else {
                type = 'cruiser';
            }
            
            enemies.push(new Enemy(type, x, -50));
            game.enemiesSpawned++;
        }
        
        function update(dt) {
            game.time += dt;
            
            for (let i = stars.length - 1; i >= 0; i--) {
                stars[i].y += stars[i].speed * dt * 60;
                if (stars[i].y > HEIGHT) {
                    stars[i].y = 0;
                    stars[i].x = Math.random() * WIDTH;
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(dt);
                if (!particles[i].alive) particles.splice(i, 1);
            }
            
            if (screenShake > 0) screenShake -= dt;
            
            if (game.state !== 'playing') return;
            
            player.update(dt, keys);
            
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update(dt);
                if (!bullets[i].alive) bullets.splice(i, 1);
            }
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(dt);
                if (!enemies[i].alive) enemies.splice(i, 1);
            }
            
            for (let i = powerUps.length - 1; i >= 0; i--) {
                powerUps[i].update(dt);
                if (!powerUps[i].alive) powerUps.splice(i, 1);
            }
            
            for (let b of bullets) {
                if (!b.isEnemy) {
                    for (let e of enemies) {
                        const dx = b.x - e.x;
                        const dy = b.y - e.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < e.width / 2 + b.radius) {
                            e.takeDamage(b.damage);
                            b.alive = false;
                            break;
                        }
                    }
                } else {
                    const dx = b.x - player.x;
                    const dy = b.y - player.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 30) {
                        player.takeDamage(b.damage);
                        b.alive = false;
                    }
                }
            }
            
            for (let e of enemies) {
                const dx = e.x - player.x;
                const dy = e.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < e.width / 2 + 20) {
                    player.takeDamage(20);
                    e.takeDamage(50);
                }
            }
            
            for (let p of powerUps) {
                const dx = p.x - player.x;
                const dy = p.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < p.radius + 25) {
                    p.apply(player);
                    p.alive = false;
                }
            }
            
            if (Math.random() < 0.005) {
                const types = ['shield', 'speed', 'bomb', 'life'];
                powerUps.push(new PowerUp(Math.random() * WIDTH, -20, types[Math.floor(Math.random() * types.length)]));
            }
            
            if (player.lives <= 0) {
                game.state = 'gameover';
            }
            
            if (game.waveDelay > 0) {
                game.waveDelay -= dt;
            } else if (game.enemiesSpawned < game.enemiesInWave) {
                game.spawnTimer -= dt;
                if (game.spawnTimer <= 0) {
                    spawnEnemy();
                    game.spawnTimer = Math.max(0.5, 2 - game.wave * 0.15);
                }
            } else if (enemies.length === 0) {
                if (game.wave >= 10) {
                    game.state = 'win';
                } else {
                    game.wave++;
                    game.enemiesInWave = 5 + game.wave * 2;
                    game.enemiesSpawned = 0;
                    game.waveDelay = 2;
                    game.spawnTimer = 0.5;
                }
            }
        }
        
        function drawBackground() {
            if (assets.background) {
                const aspectRatio = assets.background.width / assets.background.height;
                const canvasRatio = WIDTH / HEIGHT;
                let sx, sy, sw, sh;
                
                if (aspectRatio > canvasRatio) {
                    sh = assets.background.height;
                    sw = sh * canvasRatio;
                    sx = (assets.background.width - sw) / 2;
                    sy = 0;
                } else {
                    sw = assets.background.width;
                    sh = sw / canvasRatio;
                    sx = 0;
                    sy = (assets.background.height - sh) / 2;
                }
                
                ctx.drawImage(assets.background, sx, sy, sw, sh, 0, 0, WIDTH, HEIGHT);
            } else {
                const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
                gradient.addColorStop(0, '#0a0a15');
                gradient.addColorStop(0.5, '#0d1117');
                gradient.addColorStop(1, '#1a1a2e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, WIDTH, HEIGHT);
            }
            
            for (let star of stars) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + star.brightness * 0.7})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function drawHUD() {
            ctx.save();
            
            const hudPanel = ctx.createLinearGradient(0, 0, 0, 60);
            hudPanel.addColorStop(0, 'rgba(13, 17, 23, 0.9)');
            hudPanel.addColorStop(1, 'rgba(13, 17, 23, 0.3)');
            ctx.fillStyle = hudPanel;
            ctx.fillRect(0, 0, WIDTH, 70);
            
            ctx.fillStyle = 'rgba(255, 68, 68, 0.1)';
            ctx.fillRect(WIDTH - 180, 10, 170, 50);
            ctx.fillStyle = COLORS.primary;
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.shadowBlur = 10;
            ctx.shadowColor = COLORS.primary;
            ctx.fillText('ВОЛНА ' + game.wave, WIDTH - 170, 18);
            
            const healthBarWidth = 150;
            const healthBarHeight = 16;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(WIDTH - 170, 38, healthBarWidth, healthBarHeight);
            
            const healthGradient = ctx.createLinearGradient(WIDTH - 170, 0, WIDTH - 20, 0);
            healthGradient.addColorStop(0, COLORS.secondary);
            healthGradient.addColorStop(1, COLORS.primary);
            ctx.fillStyle = healthGradient;
            ctx.fillRect(WIDTH - 170, 38, healthBarWidth * (player.health / player.maxHealth), healthBarHeight);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 5;
            ctx.shadowColor = COLORS.cyan;
            ctx.fillText('ОЧКИ: ' + player.score, 100, 30);
            
            ctx.shadowBlur = 8;
            ctx.shadowColor = COLORS.accent;
            for (let i = 0; i < player.lives; i++) {
                ctx.fillStyle = COLORS.primary;
                ctx.beginPath();
                ctx.arc(180 + i * 25, 25, 10, 0, Math.PI * 2);
                ctx.fill();
            }
            
            if (player.shield > 0) {
                ctx.fillStyle = COLORS.cyan;
                ctx.font = '12px Arial';
                ctx.textAlign = 'right';
                ctx.fillText('ЩИТ: ' + Math.ceil(player.shield) + 'с', WIDTH - 190, 55);
            }
            if (player.speedBoost > 0) {
                ctx.fillStyle = COLORS.gold;
                ctx.fillText('УСКОР: ' + Math.ceil(player.speedBoost) + 'с', WIDTH - 100, 55);
            }
            
            ctx.restore();
        }
        
        function drawMenu() {
            ctx.save();
            
            drawBackground();
            
            if (assets.title) {
                const titleAspect = assets.title.width / assets.title.height;
                const titleWidth = 500;
                const titleHeight = titleWidth / titleAspect;
                ctx.drawImage(assets.title, (WIDTH - titleWidth) / 2, 50, titleWidth, titleHeight);
            } else {
                ctx.shadowBlur = 30;
                ctx.shadowColor = COLORS.primary;
                ctx.fillStyle = COLORS.primary;
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('NEON SPACE', WIDTH / 2, 150);
                
                ctx.shadowColor = COLORS.cyan;
                ctx.fillStyle = COLORS.cyan;
                ctx.fillText('SHOOTER', WIDTH / 2, 220);
            }
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = COLORS.accent;
            ctx.fillStyle = COLORS.text;
            ctx.font = '20px Arial';
            ctx.fillText('← → ↑ ↓ - ДВИЖЕНИЕ', WIDTH / 2, 320);
            ctx.fillText('ПРОБЕЛ - СТРЕЛЯТЬ', WIDTH / 2, 350);
            
            const pulse = Math.sin(game.time * 3) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.shadowColor = COLORS.primary;
            ctx.fillStyle = COLORS.primary;
            ctx.font = 'bold 28px Arial';
            ctx.fillText('НАЖМИТЕ ПРОБЕЛ', WIDTH / 2, 420);
            
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 5;
            ctx.fillStyle = '#888';
            ctx.font = '14px Arial';
            ctx.fillText('СОБЕРИТЕ БОНУСЫ: ЩИТ, УСКОРЕНИЕ, БОМБА, ЖИЗНЬ', WIDTH / 2, 480);
            ctx.fillText('ПОБЕДИ 10 ВОЛН ДЛЯ ПОБЕДЫ!', WIDTH / 2, 500);
            
            ctx.restore();
        }
        
        function drawGameOver() {
            ctx.save();
            
            drawBackground();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            ctx.shadowBlur = 30;
            ctx.shadowColor = COLORS.primary;
            ctx.fillStyle = COLORS.primary;
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ИГРА ОКОНЧЕНА', WIDTH / 2, HEIGHT / 2 - 50);
            
            ctx.shadowColor = COLORS.gold;
            ctx.fillStyle = COLORS.gold;
            ctx.font = '32px Arial';
            ctx.fillText('СЧЁТ: ' + player.score, WIDTH / 2, HEIGHT / 2 + 20);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = '24px Arial';
            ctx.fillText('ВОЛНА: ' + game.wave, WIDTH / 2, HEIGHT / 2 + 60);
            
            const pulse = Math.sin(game.time * 3) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = COLORS.cyan;
            ctx.font = 'bold 24px Arial';
            ctx.fillText('ПРОБЕЛ - ИГРАТЬ СНОВА', WIDTH / 2, HEIGHT / 2 + 120);
            
            ctx.restore();
        }
        
        function drawWin() {
            ctx.save();
            
            drawBackground();
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            
            ctx.shadowBlur = 40;
            ctx.shadowColor = COLORS.gold;
            ctx.fillStyle = COLORS.gold;
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ПОБЕДА!', WIDTH / 2, HEIGHT / 2 - 60);
            
            ctx.shadowColor = COLORS.cyan;
            ctx.fillStyle = COLORS.cyan;
            ctx.font = '32px Arial';
            ctx.fillText('СЧЁТ: ' + player.score, WIDTH / 2, HEIGHT / 2 + 10);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = '20px Arial';
            ctx.fillText('ВСЕ 10 ВОЛН ПРОЙДЕНЫ!', WIDTH / 2, HEIGHT / 2 + 50);
            
            const pulse = Math.sin(game.time * 3) * 0.3 + 0.7;
            ctx.globalAlpha = pulse;
            ctx.fillStyle = COLORS.accent;
            ctx.font = 'bold 24px Arial';
            ctx.fillText('ПРОБЕЛ - ИГРАТЬ СНОВА', WIDTH / 2, HEIGHT / 2 + 110);
            
            ctx.restore();
        }
        
        function draw() {
            ctx.save();
            
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake * 20;
                const shakeY = (Math.random() - 0.5) * screenShake * 20;
                ctx.translate(shakeX, shakeY);
            }
            
            if (game.state === 'menu') {
                drawMenu();
            } else if (game.state === 'gameover') {
                drawGameOver();
            } else if (game.state === 'win') {
                drawWin();
            } else {
                drawBackground();
                
                for (let p of particles) p.draw();
                
                for (let b of bullets) b.draw();
                
                for (let e of enemies) e.draw();
                
                for (let p of powerUps) p.draw();
                
                player.draw();
                
                drawHUD();
            }
            
            ctx.restore();
        }
        
        let lastTime = 0;
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;
            
            update(dt);
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
