<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Городской Удар 90х</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0d0500;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        
        #gameContainer {
            position: relative;
            width: min(100vw, 1280px);
            height: min(80vh, 720px);
        }
        
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 4px solid #ff6600;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5), inset 0 0 60px rgba(0, 0, 0, 0.5);
        }
        
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="scanlines"></div>
    </div>

    <script>
        // ==================== КОНФИГУРАЦИЯ ====================
        const CONFIG = {
            WIDTH: 1280,
            HEIGHT: 720,
            GRAVITY: 0.6,
            FRICTION: 0.85,
            TILE_SIZE: 48,
            COLORS: {
                BG: '#1a0a00',
                PRIMARY: '#ff6600',
                SECONDARY: '#cc4400',
                TEXT: '#ffcc00',
                ACCENT: '#ff9900',
                DARK: '#0d0500'
            }
        };

        // ==================== СОСТОЯНИЕ ИГРЫ ====================
        const GameState = {
            TITLE: 'title',
            PLAYING: 'playing',
            PAUSED: 'paused',
            GAMEOVER: 'gameover',
            WIN: 'win',
            LEVEL_COMPLETE: 'level_complete'
        };

        // ==================== УТИЛИТЫ ====================
        const Utils = {
            clamp: (val, min, max) => Math.max(min, Math.min(max, val)),
            lerp: (a, b, t) => a + (b - a) * t,
            random: (min, max) => Math.random() * (max - min) + min,
            randomInt: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
            distance: (x1, y1, x2, y2) => Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2),
            rectIntersect: (r1, r2) => r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y
        };

        // ==================== СИСТЕМА ЧАСТИЦ ====================
        class Particle {
            constructor(x, y, vx, vy, color, size, life, type = 'square') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                this.type = type;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.3;
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.vy += 0.3 * dt;
                this.life -= dt;
                this.rotation += this.rotationSpeed * dt;
                return this.life > 0;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                if (this.type === 'square') {
                    ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else if (this.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.type === 'star') {
                    this.drawStar(ctx, 0, 0, 5, this.size / 2, this.size / 4);
                }

                ctx.restore();
            }

            drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
                let rot = Math.PI / 2 * 3;
                let step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                    rot += step;
                    ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }
        }

        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            emit(x, y, count, config) {
                for (let i = 0; i < count; i++) {
                    const angle = config.angle !== undefined ? config.angle + (Math.random() - 0.5) * config.spread : Math.random() * Math.PI * 2;
                    const speed = Utils.random(config.speedMin || 2, config.speedMax || 5);
                    const vx = Math.cos(angle) * speed;
                    const vy = Math.sin(angle) * speed;
                    const size = Utils.random(config.sizeMin || 4, config.sizeMax || 8);
                    const life = Utils.random(config.lifeMin || 20, config.lifeMax || 40);
                    const type = config.types ? config.types[Math.floor(Math.random() * config.types.length)] : 'square';
                    
                    this.particles.push(new Particle(x, y, vx, vy, config.color || CONFIG.COLORS.ACCENT, size, life, type));
                }
            }

            update(dt) {
                this.particles = this.particles.filter(p => p.update(dt));
            }

            draw(ctx) {
                this.particles.forEach(p => p.draw(ctx));
            }

            clear() {
                this.particles = [];
            }
        }

        // ==================== ИГРОВОЙ ОБЪЕКТ ====================
        class GameObject {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.vx = 0;
                this.vy = 0;
                this.active = true;
            }

            getBounds() {
                return { x: this.x, y: this.y, w: this.width, h: this.height };
            }
        }

        // ==================== ИГРОК ====================
        class Player extends GameObject {
            constructor(x, y) {
                super(x, y, 40, 64);
                this.spawnX = x;
                this.spawnY = y;
                this.health = 100;
                this.maxHealth = 100;
                this.lives = 3;
                this.score = 0;
                this.combo = 0;
                this.facing = 1;
                this.grounded = false;
                this.jumping = false;
                this.attacking = false;
                this.attackTimer = 0;
                this.attackCooldown = 0;
                this.hitCooldown = 0;
                this.invincible = 0;
                this.animFrame = 0;
                this.animTimer = 0;
                this.state = 'idle';
                this.kickPower = 0;
                this.punchReach = 50;
                this.hasPowerKick = false;
            }

            update(dt, platforms, keys) {
                // Обновление таймеров
                if (this.attackCooldown > 0) this.attackCooldown -= dt;
                if (this.attackTimer > 0) this.attackTimer -= dt;
                if (this.hitCooldown > 0) this.hitCooldown -= dt;
                if (this.invincible > 0) this.invincible -= dt;
                if (this.attackTimer <= 0) this.attacking = false;

                // Анимация
                this.animTimer += dt;
                if (this.animTimer > 8) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }

                // Движение
                const speed = this.hasPowerKick ? 6 : 5;
                const runSpeed = this.hasPowerKick ? 8 : 6;

                if (keys.left) {
                    this.vx -= speed * 0.3;
                    this.facing = -1;
                    if (this.grounded) this.state = 'walk';
                } else if (keys.right) {
                    this.vx += speed * 0.3;
                    this.facing = 1;
                    if (this.grounded) this.state = 'walk';
                } else {
                    if (this.grounded) this.state = 'idle';
                }

                // Бег
                if (keys.run && (keys.left || keys.right)) {
                    this.vx *= 1.1;
                    this.state = 'run';
                }

                // Прыжок
                if (keys.jump && this.grounded && !this.jumping) {
                    this.vy = -14;
                    this.grounded = false;
                    this.jumping = true;
                    this.state = 'jump';
                }
                if (!keys.jump) this.jumping = false;

                // Атака
                if (keys.attack && this.attackCooldown <= 0) {
                    this.attacking = true;
                    this.attackTimer = 15;
                    this.attackCooldown = 20;
                    this.state = 'attack';
                    this.combo = (this.combo + 1) % 3;
                    
                    // Сильный удар ногой при беге
                    if (keys.run && this.grounded) {
                        this.kickPower = 2;
                        this.state = 'kick';
                    } else {
                        this.kickPower = 1;
                    }
                }

                // Применение физики
                this.vx *= CONFIG.FRICTION;
                this.vx = Utils.clamp(this.vx, -runSpeed, runSpeed);
                this.vy += CONFIG.GRAVITY;
                this.vy = Utils.clamp(this.vy, -20, 20);

                // Коллизии с платформами
                this.grounded = false;
                for (const platform of platforms) {
                    if (this.checkCollision(platform)) {
                        this.resolveCollision(platform);
                    }
                }

                // Применение скорости
                this.x += this.vx * dt * 0.5;
                this.y += this.vy * dt * 0.5;

                // Границы уровня
                this.x = Utils.clamp(this.x, 0, CONFIG.WIDTH - this.width);
                
                // Падение вниз
                if (this.y > CONFIG.HEIGHT + 100) {
                    this.takeDamage(50);
                    this.respawn();
                }
            }

            checkCollision(rect) {
                return Utils.rectIntersect(this.getBounds(), rect);
            }

            resolveCollision(platform) {
                const bounds = this.getBounds();
                const pBounds = platform.getBounds ? platform.getBounds() : platform;
                
                const overlapX = Math.min(bounds.x + bounds.w - pBounds.x, pBounds.x + pBounds.w - bounds.x);
                const overlapY = Math.min(bounds.y + bounds.h - pBounds.y, pBounds.y + pBounds.h - bounds.y);

                if (overlapX < overlapY) {
                    if (bounds.x < pBounds.x) {
                        this.x = pBounds.x - bounds.w;
                    } else {
                        this.x = pBounds.x + pBounds.w;
                    }
                    this.vx = 0;
                } else {
                    if (bounds.y < pBounds.y) {
                        this.y = pBounds.y - bounds.h;
                        this.vy = 0;
                        this.grounded = true;
                    } else {
                        this.y = pBounds.y + pBounds.h;
                        this.vy = 0;
                    }
                }
            }

            getAttackBox() {
                if (!this.attacking) return null;
                return {
                    x: this.facing === 1 ? this.x + this.width : this.x - this.punchReach,
                    y: this.y + 10,
                    w: this.punchReach,
                    h: 40
                };
            }

            takeDamage(amount) {
                if (this.invincible > 0 || this.hitCooldown > 0) return;
                
                this.health -= amount;
                this.hitCooldown = 30;
                this.invincible = 60;
                this.vx = -this.facing * 5;
                this.vy = -3;
                
                if (this.health <= 0) {
                    this.lives--;
                    if (this.lives > 0) {
                        this.health = this.maxHealth;
                        this.respawn();
                    }
                }
            }

            heal(amount) {
                this.health = Math.min(this.maxHealth, this.health + amount);
            }

            respawn() {
                this.x = this.spawnX;
                this.y = this.spawnY;
                this.vx = 0;
                this.vy = 0;
            }

            draw(ctx) {
                ctx.save();
                
                // Мерцание при неуязвимости
                if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                }

                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                ctx.translate(cx, cy);
                if (this.facing === -1) ctx.scale(-1, 1);

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, this.height / 2 - 5, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Тело
                const bodyBob = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 2 : 0;
                const bodyLean = this.state === 'run' ? 0.1 : 0;
                ctx.rotate(bodyLean);

                // Ноги
                ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                const legSpread = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 8 : 0;
                const kickLeg = this.state === 'kick' ? 25 : 0;
                
                // Левая нога
                ctx.fillRect(-12, 5 + bodyBob, 10, 28 - legSpread);
                // Правая нога (может быть в ударе)
                ctx.fillRect(2, 5 + bodyBob - (this.state === 'kick' ? 5 : 0), 10, 28 + (this.state === 'kick' ? kickLeg : -legSpread));

                // Торс
                ctx.fillStyle = CONFIG.COLORS.PRIMARY;
                ctx.fillRect(-15, -20 + bodyBob, 30, 30);

                // Куртка с деталями
                ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                ctx.fillRect(-15, -20 + bodyBob, 6, 25);
                ctx.fillRect(9, -20 + bodyBob, 6, 25);

                // Голова
                ctx.fillStyle = '#ffcc99';
                ctx.fillRect(-10, -40 + bodyBob, 20, 22);

                // Волосы
                ctx.fillStyle = '#2a1a00';
                ctx.fillRect(-12, -44 + bodyBob, 24, 10);

                // Глаза
                ctx.fillStyle = '#000';
                ctx.fillRect(-6, -34 + bodyBob, 4, 4);
                ctx.fillRect(2, -34 + bodyBob, 4, 4);

                // Хмурый вид
                ctx.fillRect(-8, -28 + bodyBob, 6, 2);
                ctx.fillRect(2, -28 + bodyBob, 6, 2);

                // Руки
                ctx.fillStyle = '#ffcc99';
                const armSwing = this.state === 'walk' ? Math.cos(this.animFrame * Math.PI / 2) * 15 : 0;
                const punchExtend = this.attacking ? 15 * this.kickPower : 0;

                // Задняя рука
                ctx.fillRect(-20, -15 + bodyBob - armSwing, 8, 20);
                // Передняя рука (в ударе)
                ctx.fillRect(12, -15 + bodyBob + armSwing, 8 + punchExtend, 12);

                // Кулак при ударе
                if (this.attacking) {
                    ctx.fillStyle = CONFIG.COLORS.ACCENT;
                    ctx.fillRect(18 + punchExtend, -18 + bodyBob + armSwing, 12, 18);
                }

                ctx.restore();
            }
        }

        // ==================== ВРАГ ====================
        class Enemy extends GameObject {
            constructor(x, y, type = 'thug') {
                super(x, y, 36, 60);
                this.type = type;
                this.health = type === 'brute' ? 80 : type === 'runner' ? 30 : 50;
                this.maxHealth = this.health;
                this.speed = type === 'runner' ? 3 : type === 'brute' ? 1 : 2;
                this.damage = type === 'brute' ? 25 : type === 'runner' ? 10 : 15;
                this.scoreValue = type === 'brute' ? 200 : type === 'runner' ? 50 : 100;
                this.facing = -1;
                this.active = true;
                this.attackCooldown = 0;
                this.hitCooldown = 0;
                this.animFrame = 0;
                this.animTimer = 0;
                this.state = 'idle';
                this.patrolDir = Math.random() > 0.5 ? 1 : -1;
                this.patrolTimer = 0;
                this.chasing = false;
                this.attackRange = 60;
                this.vx = 0;
                this.vy = 0;
            }

            update(dt, player, platforms) {
                if (!this.active) return;

                if (this.attackCooldown > 0) this.attackCooldown -= dt;
                if (this.hitCooldown > 0) this.hitCooldown -= dt;

                this.animTimer += dt;
                if (this.animTimer > 10) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                }

                const dist = Utils.distance(this.x + this.width / 2, this.y, player.x + player.width / 2, player.y);
                
                // Логика поведения
                if (dist < 300) {
                    this.chasing = true;
                    this.facing = player.x > this.x ? 1 : -1;
                    
                    if (dist > this.attackRange) {
                        this.vx = this.facing * this.speed;
                        this.state = 'walk';
                    } else {
                        this.vx = 0;
                        if (this.attackCooldown <= 0) {
                            this.attack(player);
                        }
                    }
                } else {
                    this.chasing = false;
                    this.patrol();
                }

                // Физика
                this.vy += CONFIG.GRAVITY;
                
                // Коллизии
                this.grounded = false;
                for (const platform of platforms) {
                    if (this.checkCollision(platform)) {
                        this.resolveCollision(platform);
                    }
                }

                this.x += this.vx * dt * 0.5;
                this.y += this.vy * dt * 0.5;

                // Границы
                if (this.x < 0) { this.x = 0; this.patrolDir = 1; }
                if (this.x > CONFIG.WIDTH - this.width) { this.x = CONFIG.WIDTH - this.width; this.patrolDir = -1; }
            }

            patrol() {
                this.patrolTimer++;
                if (this.patrolTimer > 120) {
                    this.patrolDir *= -1;
                    this.patrolTimer = 0;
                }
                this.vx = this.patrolDir * this.speed * 0.5;
                this.facing = this.patrolDir;
                this.state = 'walk';
            }

            attack(player) {
                this.attackCooldown = this.type === 'brute' ? 60 : 40;
                this.state = 'attack';
                
                const attackBox = {
                    x: this.facing === 1 ? this.x + this.width : this.x - 40,
                    y: this.y + 10,
                    w: 40,
                    h: 40
                };

                const playerBounds = player.getBounds();
                if (Utils.rectIntersect(attackBox, playerBounds)) {
                    player.takeDamage(this.damage);
                }
            }

            takeDamage(amount, knockbackDir) {
                this.health -= amount;
                this.hitCooldown = 15;
                this.vx = knockbackDir * 8;
                this.vy = -5;

                if (this.health <= 0) {
                    this.active = false;
                    return true;
                }
                return false;
            }

            checkCollision(rect) {
                return Utils.rectIntersect(this.getBounds(), rect);
            }

            resolveCollision(platform) {
                const bounds = this.getBounds();
                const pBounds = platform.getBounds ? platform.getBounds() : platform;
                
                const overlapY = Math.min(bounds.y + bounds.h - pBounds.y, pBounds.y + pBounds.h - bounds.y);
                
                if (bounds.y + bounds.h > pBounds.y && bounds.y < pBounds.y) {
                    this.y = pBounds.y - bounds.h;
                    this.vy = 0;
                    this.grounded = true;
                }
            }

            draw(ctx) {
                if (!this.active) return;

                ctx.save();
                
                if (this.hitCooldown > 0 && Math.floor(this.hitCooldown / 3) % 2 === 0) {
                    ctx.globalAlpha = 0.7;
                }

                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;

                ctx.translate(cx, cy);
                if (this.facing === -1) ctx.scale(-1, 1);

                const bodyBob = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 2 : 0;

                // Тень
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, this.height / 2 - 5, 18, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ноги
                ctx.fillStyle = '#3a2a1a';
                const legSpread = this.state === 'walk' ? Math.sin(this.animFrame * Math.PI / 2) * 6 : 0;
                ctx.fillRect(-10, 5 + bodyBob, 8, 24 - legSpread);
                ctx.fillRect(2, 5 + bodyBob, 8, 24 + legSpread);

                // Тело
                ctx.fillStyle = this.type === 'brute' ? '#553322' : this.type === 'runner' ? '#224455' : '#443322';
                ctx.fillRect(-14, -18 + bodyBob, 28, 28);

                // Голова
                ctx.fillStyle = '#cc9966';
                ctx.fillRect(-9, -38 + bodyBob, 18, 20);

                // Глаза (злые)
                ctx.fillStyle = '#fff';
                ctx.fillRect(-6, -32 + bodyBob, 5, 4);
                ctx.fillRect(1, -32 + bodyBob, 5, 4);
                ctx.fillStyle = '#f00';
                ctx.fillRect(-4, -31 + bodyBob, 2, 2);
                ctx.fillRect(3, -31 + bodyBob, 2, 2);

                // Шляпа/бандитская повязка
                ctx.fillStyle = this.type === 'brute' ? '#000' : '#553333';
                if (this.type !== 'runner') {
                    ctx.fillRect(-11, -42 + bodyBob, 22, 6);
                } else {
                    ctx.fillRect(-9, -42 + bodyBob, 18, 4);
                }

                // Руки
                ctx.fillStyle = '#cc9966';
                const armSwing = this.state === 'walk' ? Math.cos(this.animFrame * Math.PI / 2) * 10 : 0;
                ctx.fillRect(-18, -12 + bodyBob - armSwing, 7, 18);
                ctx.fillRect(11, -12 + bodyBob + armSwing, 7, 18);

                // Полоса на груди
                ctx.fillStyle = CONFIG.COLORS.ACCENT;
                ctx.fillRect(-2, -15 + bodyBob, 4, 20);

                ctx.restore();

                // Полоска здоровья
                if (this.health < this.maxHealth) {
                    const barWidth = 40;
                    const barHeight = 6;
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x - 2, this.y - 15, barWidth, barHeight);
                    ctx.fillStyle = '#f00';
                    ctx.fillRect(this.x, this.y - 13, (this.health / this.maxHealth) * barWidth, barHeight - 2);
                }
            }
        }

        // ==================== ПЛАТФОРМА ====================
        class Platform extends GameObject {
            constructor(x, y, width, height, type = 'ground') {
                super(x, y, width, height);
                this.type = type;
            }

            draw(ctx) {
                ctx.save();

                if (this.type === 'ground') {
                    // Асфальт
                    ctx.fillStyle = '#2a2a2a';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // Верхний край
                    ctx.fillStyle = '#444';
                    ctx.fillRect(this.x, this.y, this.width, 6);
                    
                    // Детали асфальта
                    ctx.fillStyle = '#333';
                    for (let i = 0; i < this.width; i += 30) {
                        ctx.fillRect(this.x + i + 10, this.y + 10, 15, 4);
                    }
                } else if (this.type === 'building') {
                    // Здание
                    ctx.fillStyle = '#1a1510';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    
                    // Кирпичи
                    ctx.strokeStyle = '#2a2015';
                    ctx.lineWidth = 1;
                    for (let y = 0; y < this.height; y += 20) {
                        for (let x = 0; x < this.width; x += 30) {
                            ctx.strokeRect(this.x + x, this.y + y, 30, 20);
                        }
                    }
                    
                    // Окна
                    ctx.fillStyle = CONFIG.COLORS.TEXT;
                    ctx.globalAlpha = 0.3;
                    for (let wy = this.y + 10; wy < this.y + this.height - 20; wy += 40) {
                        for (let wx = this.x + 10; wx < this.x + this.width - 20; wx += 35) {
                            ctx.fillRect(wx, wy, 20, 25);
                            if (Math.random() > 0.7) {
                                ctx.globalAlpha = 0.6;
                                ctx.fillStyle = '#ffff88';
                                ctx.fillRect(wx + 2, wy + 2, 16, 21);
                                ctx.globalAlpha = 0.3;
                                ctx.fillStyle = CONFIG.COLORS.TEXT;
                            }
                        }
                    }
                    ctx.globalAlpha = 1;
                } else if (this.type === 'crate') {
                    // Ящик
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.strokeStyle = '#5D2E0C';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.width, this.y + this.height);
                    ctx.moveTo(this.x + this.width, this.y);
                    ctx.lineTo(this.x, this.y + this.height);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        // ==================== БОНУСЫ ====================
        class Pickup extends GameObject {
            constructor(x, y, type) {
                super(x, y, 24, 24);
                this.type = type;
                this.active = true;
                this.bobOffset = 0;
                this.bobTimer = Math.random() * Math.PI * 2;
            }

            update(dt) {
                this.bobTimer += 0.1;
                this.bobOffset = Math.sin(this.bobTimer) * 5;
            }

            draw(ctx) {
                if (!this.active) return;

                const drawY = this.y + this.bobOffset;

                ctx.save();
                
                // Свечение
                ctx.shadowColor = this.type === 'health' ? '#00ff00' : this.type === 'coin' ? '#ffcc00' : '#ff00ff';
                ctx.shadowBlur = 15;

                if (this.type === 'coin') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2, drawY + this.height / 2, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff9900';
                    ctx.beginPath();
                    ctx.arc(this.x + this.width / 2 - 3, drawY + this.height / 2 - 3, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffcc00';
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('$', this.x + this.width / 2, drawY + this.height / 2 + 5);
                } else if (this.type === 'health') {
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(this.x + 4, drawY + 2, 16, 20);
                    ctx.fillStyle = '#008800';
                    ctx.fillRect(this.x + 2, drawY + 4, 20, 16);
                    ctx.fillStyle = '#00ff00';
                    ctx.font = 'bold 16px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('+', this.x + this.width / 2, drawY + this.height / 2 + 5);
                } else if (this.type === 'power') {
                    ctx.fillStyle = '#ff00ff';
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width / 2, drawY);
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                        const r = i % 2 === 0 ? 12 : 6;
                        ctx.lineTo(this.x + this.width / 2 + Math.cos(angle) * r, drawY + this.height / 2 + Math.sin(angle) * r);
                    }
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        // ==================== ФОН ====================
        class Background {
            constructor(level) {
                this.level = level;
                this.stars = [];
                this.buildings = [];
                this.clouds = [];
                
                // Звёзды
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * CONFIG.WIDTH,
                        y: Math.random() * CONFIG.HEIGHT * 0.5,
                        size: Math.random() * 2 + 1,
                        twinkle: Math.random() * Math.PI * 2
                    });
                }

                // Здания на заднем плане
                for (let i = 0; i < 15; i++) {
                    this.buildings.push({
                        x: i * 100 - 50,
                        width: Utils.randomInt(60, 120),
                        height: Utils.randomInt(150, 400),
                        color: `hsl(${Utils.randomInt(10, 30)}, ${Utils.randomInt(20, 40)}%, ${Utils.randomInt(10, 20)}%)`
                    });
                }

                // Облака
                for (let i = 0; i < 8; i++) {
                    this.clouds.push({
                        x: Math.random() * CONFIG.WIDTH,
                        y: Utils.randomInt(50, 150),
                        width: Utils.randomInt(80, 150),
                        speed: Utils.random(0.2, 0.5)
                    });
                }
            }

            update(dt) {
                // Движение облаков
                for (const cloud of this.clouds) {
                    cloud.x += cloud.speed * dt * 0.5;
                    if (cloud.x > CONFIG.WIDTH + cloud.width) {
                        cloud.x = -cloud.width;
                    }
                }

                // Мерцание звёзд
                for (const star of this.stars) {
                    star.twinkle += 0.1;
                }
            }

            draw(ctx) {
                // Градиент неба
                const gradient = ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT);
                gradient.addColorStop(0, '#0a0510');
                gradient.addColorStop(0.5, '#1a0a00');
                gradient.addColorStop(1, '#2a1a00');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

                // Звёзды
                for (const star of this.stars) {
                    const alpha = 0.5 + Math.sin(star.twinkle) * 0.5;
                    ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Здания на фоне
                for (const building of this.buildings) {
                    ctx.fillStyle = building.color;
                    ctx.fillRect(building.x, CONFIG.HEIGHT - building.height, building.width, building.height);
                    
                    // Окна
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.2)';
                    for (let wy = CONFIG.HEIGHT - building.height + 20; wy < CONFIG.HEIGHT - 20; wy += 30) {
                        for (let wx = building.x + 10; wx < building.x + building.width - 15; wx += 20) {
                            if (Math.random() > 0.3) {
                                ctx.fillRect(wx, wy, 10, 15);
                            }
                        }
                    }
                }

                // Облака
                ctx.fillStyle = 'rgba(60, 40, 30, 0.3)';
                for (const cloud of this.clouds) {
                    ctx.beginPath();
                    ctx.ellipse(cloud.x, cloud.y, cloud.width / 2, 20, 0, 0, Math.PI * 2);
                    ctx.ellipse(cloud.x - cloud.width / 4, cloud.y + 10, cloud.width / 3, 15, 0, 0, Math.PI * 2);
                    ctx.ellipse(cloud.x + cloud.width / 4, cloud.y + 5, cloud.width / 3, 18, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Луна
                ctx.fillStyle = '#ffeecc';
                ctx.beginPath();
                ctx.arc(CONFIG.WIDTH - 150, 100, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#0a0510';
                ctx.beginPath();
                ctx.arc(CONFIG.WIDTH - 135, 90, 45, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== УПРАВЛЕНИЕ ====================
        class InputManager {
            constructor() {
                this.keys = {
                    left: false,
                    right: false,
                    up: false,
                    down: false,
                    jump: false,
                    attack: false,
                    run: false,
                    pause: false,
                    start: false
                };
                this.pausePressed = false;
                this.startPressed = false;

                window.addEventListener('keydown', (e) => this.onKeyDown(e));
                window.addEventListener('keyup', (e) => this.onKeyUp(e));
            }

            onKeyDown(e) {
                switch(e.code) {
                    case 'ArrowLeft':
                    case 'KeyA':
                        this.keys.left = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        this.keys.right = true;
                        break;
                    case 'ArrowUp':
                    case 'KeyW':
                        this.keys.up = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        this.keys.down = true;
                        break;
                    case 'Space':
                        this.keys.jump = true;
                        break;
                    case 'KeyZ':
                    case 'KeyX':
                    case 'KeyJ':
                        this.keys.attack = true;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                    case 'KeyK':
                        this.keys.run = true;
                        break;
                    case 'Enter':
                        if (!this.startPressed) {
                            this.keys.start = true;
                            this.startPressed = true;
                        }
                        break;
                    case 'Escape':
                    case 'KeyP':
                        if (!this.pausePressed) {
                            this.keys.pause = true;
                            this.pausePressed = true;
                        }
                        break;
                }
                
                if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                    e.preventDefault();
                }
            }

            onKeyUp(e) {
                switch(e.code) {
                    case 'ArrowLeft':
                    case 'KeyA':
                        this.keys.left = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        this.keys.right = false;
                        break;
                    case 'ArrowUp':
                    case 'KeyW':
                        this.keys.up = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        this.keys.down = false;
                        break;
                    case 'Space':
                        this.keys.jump = false;
                        break;
                    case 'KeyZ':
                    case 'KeyX':
                    case 'KeyJ':
                        this.keys.attack = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                    case 'KeyK':
                        this.keys.run = false;
                        break;
                    case 'Enter':
                        this.startPressed = false;
                        break;
                    case 'Escape':
                    case 'KeyP':
                        this.pausePressed = false;
                        break;
                }
            }

            consumeStart() {
                const val = this.keys.start;
                this.keys.start = false;
                return val;
            }

            consumePause() {
                const val = this.keys.pause;
                this.keys.pause = false;
                return val;
            }
        }

        // ==================== ИГРА ====================
        class Game {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                
                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.input = new InputManager();
                this.particles = new ParticleSystem();
                
                this.state = GameState.TITLE;
                this.level = 1;
                this.maxLevels = 3;
                this.difficultyTimer = 0;
                
                this.player = null;
                this.enemies = [];
                this.platforms = [];
                this.pickups = [];
                this.background = null;
                
                this.screenShake = 0;
                this.levelCompleteTimer = 0;
                
                this.titleAnimTimer = 0;
                this.menuSelection = 0;
                
                this.lastTime = 0;
                this.running = true;
                
                this.highScore = parseInt(localStorage.getItem('cityStrikeHighScore') || '0');
            }

            resize() {
                const container = this.canvas.parentElement;
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                this.canvas.width = CONFIG.WIDTH * dpr;
                this.canvas.height = CONFIG.HEIGHT * dpr;
                
                this.ctx.scale(dpr, dpr);
                this.canvas.style.width = rect.width + 'px';
                this.canvas.style.height = rect.height + 'px';
            }

            startGame() {
                this.level = 1;
                this.loadLevel(this.level);
                this.state = GameState.PLAYING;
            }

            loadLevel(levelNum) {
                this.platforms = [];
                this.enemies = [];
                this.pickups = [];
                this.particles.clear();
                
                this.background = new Background(levelNum);
                
                // Генерация уровня
                const groundY = CONFIG.HEIGHT - 60;
                
                // Земля
                this.platforms.push(new Platform(0, groundY, CONFIG.WIDTH, 80, 'ground'));
                
                // Здания на фоне (платформы)
                this.platforms.push(new Platform(200, groundY - 150, 200, 30, 'building'));
                this.platforms.push(new Platform(500, groundY - 250, 150, 30, 'building'));
                this.platforms.push(new Platform(750, groundY - 180, 180, 30, 'building'));
                this.platforms.push(new Platform(1000, groundY - 280, 200, 30, 'building'));
                
                // Ящики
                this.platforms.push(new Platform(350, groundY - 60, 60, 60, 'crate'));
                this.platforms.push(new Platform(650, groundY - 60, 60, 60, 'crate'));
                this.platforms.push(new Platform(900, groundY - 60, 60, 60, 'crate'));
                
                // Плавающие платформы
                this.platforms.push(new Platform(100, groundY - 350, 150, 25, 'ground'));
                this.platforms.push(new Platform(450, groundY - 400, 150, 25, 'ground'));
                this.platforms.push(new Platform(800, groundY - 350, 150, 25, 'ground'));
                this.platforms.push(new Platform(1050, groundY - 450, 150, 25, 'ground'));
                
                // Игрок
                this.player = new Player(100, groundY - 100);
                this.player.spawnX = 100;
                this.player.spawnY = groundY - 100;
                
                // Враги
                const enemyTypes = ['thug', 'thug', 'runner'];
                if (levelNum >= 2) enemyTypes.push('brute');
                if (levelNum >= 3) enemyTypes.push('brute', 'runner');
                
                const enemyCount = 3 + levelNum * 2;
                for (let i = 0; i < enemyCount; i++) {
                    const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                    const x = Utils.randomInt(300, CONFIG.WIDTH - 100);
                    const y = groundY - 100;
                    this.enemies.push(new Enemy(x, y, type));
                }
                
                // Бонусы
                const pickupTypes = ['coin', 'coin', 'health', 'power'];
                for (let i = 0; i < 8 + levelNum * 2; i++) {
                    const type = pickupTypes[Math.floor(Math.random() * pickupTypes.length)];
                    const x = Utils.randomInt(100, CONFIG.WIDTH - 100);
                    const y = Utils.randomInt(100, groundY - 100);
                    this.pickups.push(new Pickup(x, y, type));
                }
                
                this.difficultyTimer = 0;
            }

            update(dt) {
                this.titleAnimTimer += dt;
                
                if (this.state === GameState.TITLE) {
                    this.updateTitle(dt);
                } else if (this.state === GameState.PLAYING) {
                    this.updatePlaying(dt);
                } else if (this.state === GameState.PAUSED) {
                    this.updatePaused(dt);
                } else if (this.state === GameState.LEVEL_COMPLETE) {
                    this.updateLevelComplete(dt);
                } else if (this.state === GameState.GAMEOVER) {
                    this.updateGameOver(dt);
                } else if (this.state === GameState.WIN) {
                    this.updateWin(dt);
                }
            }

            updateTitle(dt) {
                if (this.input.consumeStart()) {
                    this.startGame();
                }
                
                // Анимация фона
                if (this.background) {
                    this.background.update(dt);
                } else {
                    this.background = new Background(1);
                }
            }

            updatePlaying(dt) {
                // Пауза
                if (this.input.consumePause()) {
                    this.state = GameState.PAUSED;
                    return;
                }
                
                // Обновление игрока
                this.player.update(dt, this.platforms, this.input.keys);
                
                // Обновление врагов
                for (const enemy of this.enemies) {
                    enemy.update(dt, this.player, this.platforms);
                }
                
                // Проверка атаки игрока
                const attackBox = this.player.getAttackBox();
                if (attackBox) {
                    for (const enemy of this.enemies) {
                        if (!enemy.active) continue;
                        
                        if (Utils.rectIntersect(attackBox, enemy.getBounds())) {
                            const killed = enemy.takeDamage(20 * this.player.kickPower, this.player.facing);
                            
                            if (killed) {
                                this.player.score += enemy.scoreValue;
                                this.player.combo++;
                                
                                // Эффект смерти врага
                                this.particles.emit(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 20, {
                                    color: CONFIG.COLORS.ACCENT,
                                    speedMin: 3,
                                    speedMax: 8,
                                    sizeMin: 4,
                                    sizeMax: 10,
                                    lifeMin: 30,
                                    lifeMax: 60,
                                    types: ['square', 'star']
                                });
                                
                                this.screenShake = 10;
                            } else {
                                // Эффект попадания
                                this.particles.emit(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, {
                                    color: '#ff0000',
                                    speedMin: 2,
                                    speedMax: 5,
                                    sizeMin: 3,
                                    sizeMax: 6,
                                    lifeMin: 15,
                                    lifeMax: 30
                                });
                            }
                        }
                    }
                }
                
                // Обновление бонусов
                for (const pickup of this.pickups) {
                    if (!pickup.active) continue;
                    pickup.update(dt);
                    
                    if (Utils.rectIntersect(pickup.getBounds(), this.player.getBounds())) {
                        pickup.active = false;
                        
                        if (pickup.type === 'coin') {
                            this.player.score += 50;
                            this.particles.emit(pickup.x + 12, pickup.y + 12, 10, {
                                color: '#ffcc00',
                                speedMin: 2,
                                speedMax: 4,
                                sizeMin: 2,
                                sizeMax: 5,
                                lifeMin: 20,
                                lifeMax: 40,
                                types: ['circle']
                            });
                        } else if (pickup.type === 'health') {
                            this.player.heal(25);
                            this.particles.emit(pickup.x + 12, pickup.y + 12, 15, {
                                color: '#00ff00',
                                speedMin: 1,
                                speedMax: 3,
                                sizeMin: 3,
                                sizeMax: 6,
                                lifeMin: 25,
                                lifeMax: 45,
                                types: ['star']
                            });
                        } else if (pickup.type === 'power') {
                            this.player.hasPowerKick = true;
                            setTimeout(() => { if (this.player) this.player.hasPowerKick = false; }, 10000);
                            this.particles.emit(pickup.x + 12, pickup.y + 12, 25, {
                                color: '#ff00ff',
                                speedMin: 2,
                                speedMax: 6,
                                sizeMin: 4,
                                sizeMax: 8,
                                lifeMin: 30,
                                lifeMax: 50,
                                types: ['star', 'circle']
                            });
                        }
                    }
                }
                
                // Обновление частиц
                this.particles.update(dt);
                
                // Обновление фона
                this.background.update(dt);
                
                // Screen shake
                if (this.screenShake > 0) this.screenShake -= dt;
                
                // Прогрессия сложности
                this.difficultyTimer += dt;
                if (this.difficultyTimer > 600) {
                    // Спавн новых врагов
                    const enemyTypes = ['thug', 'runner'];
                    if (this.level >= 2) enemyTypes.push('brute');
                    const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                    this.enemies.push(new Enemy(CONFIG.WIDTH + 50, CONFIG.HEIGHT - 160, type));
                    this.difficultyTimer = 0;
                }
                
                // Проверка условий уровня
                const activeEnemies = this.enemies.filter(e => e.active).length;
                if (activeEnemies === 0 && this.enemies.length > 0) {
                    this.state = GameState.LEVEL_COMPLETE;
                    this.levelCompleteTimer = 0;
                }
                
                // Проверка смерти игрока
                if (this.player.lives <= 0) {
                    this.state = GameState.GAMEOVER;
                    if (this.player.score > this.highScore) {
                        this.highScore = this.player.score;
                        localStorage.setItem('cityStrikeHighScore', this.highScore.toString());
                    }
                }
            }

            updatePaused(dt) {
                if (this.input.consumePause()) {
                    this.state = GameState.PLAYING;
                }
            }

            updateLevelComplete(dt) {
                this.levelCompleteTimer += dt;
                this.particles.update(dt);
                
                if (this.levelCompleteTimer > 120 && this.input.consumeStart()) {
                    this.level++;
                    if (this.level > this.maxLevels) {
                        this.state = GameState.WIN;
                    } else {
                        this.loadLevel(this.level);
                        this.state = GameState.PLAYING;
                    }
                }
            }

            updateGameOver(dt) {
                if (this.input.consumeStart()) {
                    this.state = GameState.TITLE;
                }
            }

            updateWin(dt) {
                if (this.input.consumeStart()) {
                    this.state = GameState.TITLE;
                }
            }

            draw() {
                const ctx = this.ctx;
                
                ctx.save();
                
                // Screen shake
                if (this.screenShake > 0) {
                    const shakeX = (Math.random() - 0.5) * this.screenShake;
                    const shakeY = (Math.random() - 0.5) * this.screenShake;
                    ctx.translate(shakeX, shakeY);
                }
                
                if (this.state === GameState.TITLE) {
                    this.drawTitle(ctx);
                } else if (this.state === GameState.PLAYING || this.state === GameState.PAUSED) {
                    this.drawGame(ctx);
                    if (this.state === GameState.PAUSED) {
                        this.drawPauseOverlay(ctx);
                    }
                } else if (this.state === GameState.LEVEL_COMPLETE) {
                    this.drawGame(ctx);
                    this.drawLevelCompleteOverlay(ctx);
                } else if (this.state === GameState.GAMEOVER) {
                    this.drawGame(ctx);
                    this.drawGameOverOverlay(ctx);
                } else if (this.state === GameState.WIN) {
                    this.drawGame(ctx);
                    this.drawWinOverlay(ctx);
                }
                
                ctx.restore();
            }

            drawTitle(ctx) {
                // Фон
                this.background.draw(ctx);
                
                // Затемнение
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                // Заголовок
                const titleY = 150 + Math.sin(this.titleAnimTimer * 0.05) * 10;
                
                ctx.save();
                ctx.shadowColor = CONFIG.COLORS.PRIMARY;
                ctx.shadowBlur = 30;
                
                ctx.fillStyle = CONFIG.COLORS.PRIMARY;
                ctx.font = 'bold 72px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('ГОРОДСКОЙ', CONFIG.WIDTH / 2, titleY);
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 84px monospace';
                ctx.fillText('УДАР 90х', CONFIG.WIDTH / 2, titleY + 80);
                
                ctx.restore();
                
                // Подзаголовок
                ctx.fillStyle = CONFIG.COLORS.ACCENT;
                ctx.font = '24px monospace';
                ctx.fillText('БЕГИ • ПРЫГАЙ • БЕЙ', CONFIG.WIDTH / 2, titleY + 140);
                
                // Панель управления
                ctx.fillStyle = 'rgba(30, 20, 10, 0.9)';
                ctx.fillRect(CONFIG.WIDTH / 2 - 250, CONFIG.HEIGHT / 2 - 30, 500, 200);
                ctx.strokeStyle = CONFIG.COLORS.PRIMARY;
                ctx.lineWidth = 3;
                ctx.strokeRect(CONFIG.WIDTH / 2 - 250, CONFIG.HEIGHT / 2 - 30, 500, 200);
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = '20px monospace';
                ctx.textAlign = 'left';
                
                const panelX = CONFIG.WIDTH / 2 - 220;
                let panelY = CONFIG.HEIGHT / 2 + 10;
                
                ctx.fillText('← → / A D    Движение', panelX, panelY);
                panelY += 35;
                ctx.fillText('ПРОБЕЛ / W    Прыжок', panelX, panelY);
                panelY += 35;
                ctx.fillText('SHIFT          Бег', panelX, panelY);
                panelY += 35;
                ctx.fillText('Z / X / J      Удар', panelX, panelY);
                panelY += 35;
                ctx.fillText('ESC / P        Пауза', panelX, panelY);
                
                // Старт
                const blink = Math.sin(this.titleAnimTimer * 0.1) > 0;
                if (blink) {
                    ctx.fillStyle = CONFIG.COLORS.ACCENT;
                    ctx.font = 'bold 28px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('НАЖМИТЕ ENTER ДЛЯ СТАРТА', CONFIG.WIDTH / 2, CONFIG.HEIGHT - 100);
                }
                
                // Рекорд
                ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                ctx.font = '18px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`ЛУЧШИЙ СЧЁТ: ${this.highScore}`, CONFIG.WIDTH / 2, CONFIG.HEIGHT - 50);
            }

            drawGame(ctx) {
                // Фон
                this.background.draw(ctx);
                
                // Платформы
                for (const platform of this.platforms) {
                    platform.draw(ctx);
                }
                
                // Бонусы
                for (const pickup of this.pickups) {
                    pickup.draw(ctx);
                }
                
                // Игрок
                this.player.draw(ctx);
                
                // Враги
                for (const enemy of this.enemies) {
                    enemy.draw(ctx);
                }
                
                // Частицы
                this.particles.draw(ctx);
                
                // HUD
                this.drawHUD(ctx);
            }

            drawHUD(ctx) {
                // Панель сверху
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, 60);
                ctx.fillStyle = CONFIG.COLORS.PRIMARY;
                ctx.fillRect(0, 58, CONFIG.WIDTH, 4);
                
                // Жизни
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'left';
                ctx.fillText('♥'.repeat(this.player.lives), 20, 38);
                
                // Здоровье
                ctx.fillStyle = '#333';
                ctx.fillRect(120, 15, 200, 25);
                const healthWidth = (this.player.health / this.player.maxHealth) * 196;
                const healthGradient = ctx.createLinearGradient(122, 0, 122 + healthWidth, 0);
                healthGradient.addColorStop(0, '#ff3300');
                healthGradient.addColorStop(1, '#ff6600');
                ctx.fillStyle = healthGradient;
                ctx.fillRect(122, 17, healthWidth, 21);
                ctx.strokeStyle = CONFIG.COLORS.PRIMARY;
                ctx.lineWidth = 2;
                ctx.strokeRect(120, 15, 200, 25);
                
                // Счёт
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`СЧЁТ: ${this.player.score}`, CONFIG.WIDTH / 2, 40);
                
                // Уровень
                ctx.fillStyle = CONFIG.COLORS.ACCENT;
                ctx.font = '18px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`УРОВЕНЬ ${this.level}`, CONFIG.WIDTH - 20, 30);
                
                // Враги
                const activeEnemies = this.enemies.filter(e => e.active).length;
                ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                ctx.fillText(`БАНДИТОВ: ${activeEnemies}`, CONFIG.WIDTH - 20, 52);
                
                // Индикатор силы
                if (this.player.hasPowerKick) {
                    ctx.fillStyle = '#ff00ff';
                    ctx.font = 'bold 16px monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText('⚡ СИЛЬНЫЙ УДАР', 350, 38);
                }
            }

            drawPauseOverlay(ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 48px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('ПАУЗА', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 20);
                
                ctx.font = '24px monospace';
                ctx.fillText('Нажмите ESC для продолжения', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 30);
            }

            drawLevelCompleteOverlay(ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                ctx.save();
                ctx.shadowColor = CONFIG.COLORS.TEXT;
                ctx.shadowBlur = 20;
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 56px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 50);
                
                ctx.restore();
                
                ctx.fillStyle = CONFIG.COLORS.ACCENT;
                ctx.font = '32px monospace';
                ctx.fillText(`СЧЁТ: ${this.player.score}`, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 20);
                
                if (this.level < this.maxLevels) {
                    const blink = Math.sin(this.titleAnimTimer * 0.1) > 0;
                    if (blink) {
                        ctx.font = '24px monospace';
                        ctx.fillText('ENTER - СЛЕДУЮЩИЙ УРОВЕНЬ', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 80);
                    }
                }
            }

            drawGameOverOverlay(ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                ctx.save();
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 30;
                
                ctx.fillStyle = '#ff3300';
                ctx.font = 'bold 64px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('ИГРА ОКОНЧЕНА', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 60);
                
                ctx.restore();
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = '32px monospace';
                ctx.fillText(`ФИНАЛЬНЫЙ СЧЁТ: ${this.player.score}`, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 10);
                
                if (this.player.score >= this.highScore) {
                    ctx.fillStyle = CONFIG.COLORS.ACCENT;
                    ctx.font = 'bold 28px monospace';
                    ctx.fillText('НОВЫЙ РЕКОРД!', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 60);
                }
                
                const blink = Math.sin(this.titleAnimTimer * 0.1) > 0;
                if (blink) {
                    ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                    ctx.font = '24px monospace';
                    ctx.fillText('ENTER - В МЕНЮ', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 120);
                }
            }

            drawWinOverlay(ctx) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);
                
                ctx.save();
                ctx.shadowColor = CONFIG.COLORS.TEXT;
                ctx.shadowBlur = 30;
                
                ctx.fillStyle = CONFIG.COLORS.TEXT;
                ctx.font = 'bold 64px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('ПОБЕДА!', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 80);
                
                ctx.restore();
                
                ctx.fillStyle = CONFIG.COLORS.ACCENT;
                ctx.font = '28px monospace';
                ctx.fillText('ГОРОД ОЧИЩЕН ОТ БАНДИТОВ', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 - 20);
                
                ctx.fillStyle = CONFIG.COLORS.PRIMARY;
                ctx.font = 'bold 36px monospace';
                ctx.fillText(`ФИНАЛЬНЫЙ СЧЁТ: ${this.player.score}`, CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 40);
                
                if (this.player.score >= this.highScore) {
                    ctx.fillStyle = '#ff00ff';
                    ctx.font = 'bold 28px monospace';
                    ctx.fillText('НОВЫЙ РЕКОРД!', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 90);
                }
                
                const blink = Math.sin(this.titleAnimTimer * 0.1) > 0;
                if (blink) {
                    ctx.fillStyle = CONFIG.COLORS.SECONDARY;
                    ctx.font = '24px monospace';
                    ctx.fillText('ENTER - В МЕНЮ', CONFIG.WIDTH / 2, CONFIG.HEIGHT / 2 + 150);
                }
            }

            gameLoop(currentTime) {
                const deltaTime = Math.min((currentTime - this.lastTime) / 16.67, 3);
                this.lastTime = currentTime;
                
                this.update(deltaTime);
                this.draw();
                
                requestAnimationFrame((t) => this.gameLoop(t));
            }

            start() {
                this.lastTime = performance.now();
                this.gameLoop(this.lastTime);
            }
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        window.addEventListener('load', () => {
            const canvas = document.getElementById('gameCanvas');
            const game = new Game(canvas);
            game.start();
        });
    </script>
</body>
</html>
