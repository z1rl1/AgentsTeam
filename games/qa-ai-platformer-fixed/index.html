<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Улицы 90х</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0500;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        #gameCanvas {
            border: 4px solid #ff6600;
            box-shadow: 0 0 40px rgba(255,102,0,0.6), inset 0 0 60px rgba(255,102,0,0.1);
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 960;
        canvas.height = 540;
        
        const COLORS = {
            bg: '#1a0a00',
            primary: '#ff6600',
            secondary: '#cc4400',
            accent: '#ff9900',
            text: '#ffcc00'
        };
        
        let gameState = 'start';
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let lives = 3;
        let levelWidth = 3200;
        let cameraX = 0;
        let screenShake = 0;
        let screenFlash = 0;
        let lastTime = 0;
        let gameTime = 0;
        
        const player = {
            x: 100, y: 300, width: 44, height: 64,
            vx: 0, vy: 0, speed: 280, jumpForce: -520,
            grounded: false, facing: 1, state: 'idle',
            animFrame: 0, animTimer: 0, health: 100, maxHealth: 100,
            attacking: false, attackTimer: 0, attackCooldown: 0,
            invincible: 0, hitCombo: 0, attackPhase: 0
        };
        
        let enemies = [];
        let platforms = [];
        let particles = [];
        let bgBuildings = [];
        let decorations = [];
        
        function init() {
            score = 0; combo = 0; comboTimer = 0; lives = 3; gameTime = 0;
            cameraX = 0; screenShake = 0; screenFlash = 0;
            
            player.x = 100; player.y = 280;
            player.vx = 0; player.vy = 0;
            player.health = player.maxHealth;
            player.grounded = false;
            player.invincible = 0;
            player.attacking = false;
            player.attackTimer = 0;
            player.attackCooldown = 0;
            player.facing = 1;
            
            // Create platforms
            platforms = [
                { x: -50, y: 460, w: levelWidth + 100, h: 100, type: 'ground' },
                { x: 250, y: 360, w: 180, h: 20, type: 'roof' },
                { x: 550, y: 300, w: 150, h: 20, type: 'roof' },
                { x: 850, y: 380, w: 200, h: 20, type: 'roof' },
                { x: 1150, y: 280, w: 120, h: 20, type: 'roof' },
                { x: 1450, y: 340, w: 160, h: 20, type: 'roof' },
                { x: 1750, y: 400, w: 140, h: 20, type: 'roof' },
                { x: 2050, y: 320, w: 180, h: 20, type: 'roof' },
                { x: 2350, y: 380, w: 150, h: 20, type: 'roof' },
                { x: 2650, y: 300, w: 200, h: 20, type: 'roof' },
                { x: 2950, y: 360, w: 170, h: 20, type: 'roof' }
            ];
            
            // Create enemies
            enemies = [];
            const eSpawns = [
                { x: 380, y: 400 }, { x: 680, y: 400 }, { x: 980, y: 320 },
                { x: 1250, y: 220 }, { x: 1550, y: 280 }, { x: 1850, y: 340 },
                { x: 2150, y: 260 }, { x: 2450, y: 320 }, { x: 2750, y: 240 },
                { x: 3050, y: 300 }, { x: 500, y: 400 }, { x: 1600, y: 400 }
            ];
            
            eSpawns.forEach((s, i) => {
                enemies.push({
                    x: s.x, y: s.y, width: 38, height: 58,
                    vx: 0, vy: 0, health: 60 + i * 5, maxHealth: 60 + i * 5,
                    speed: 70 + Math.random() * 40, state: 'idle',
                    facing: -1, animFrame: 0, animTimer: 0,
                    attackCooldown: 0, hitTimer: 0, patrolDir: 1,
                    patrolTimer: Math.random() * 2, alive: true, type: i % 2
                });
            });
            
            // Background buildings
            bgBuildings = [];
            for (let x = -200; x < levelWidth + 400; x += 70 + Math.random() * 50) {
                bgBuildings.push({
                    x: x,
                    w: 50 + Math.random() * 60,
                    h: 120 + Math.random() * 180,
                    color: `hsl(${25 + Math.random() * 15}, ${60 + Math.random() * 20}%, ${8 + Math.random() * 8}%)`,
                    windows: Math.floor(Math.random() * 8) + 3,
                    litWindows: []
                });
                // Generate lit windows
                for (let i = 0; i < bgBuildings[bgBuildings.length-1].windows * 2; i++) {
                    bgBuildings[bgBuildings.length-1].litWindows.push(Math.random() > 0.6);
                }
            }
            
            // Decorations
            decorations = [];
            for (let x = 50; x < levelWidth; x += 150 + Math.random() * 200) {
                decorations.push({
                    x: x, type: Math.random() > 0.5 ? 'lamp' : 'fountain',
                    y: 450
                });
            }
            
            particles = [];
        }
        
        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown') {
                e.preventDefault();
            }
            if ((gameState === 'start' || gameState === 'gameover') && 
                (e.code === 'Space' || e.code === 'Enter')) {
                gameState = 'playing';
                init();
            }
            if (gameState === 'win' && (e.code === 'Space' || e.code === 'Enter')) {
                gameState = 'start';
            }
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        
        function spawnParticles(x, y, count, color, speed = 200) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * speed * 2,
                    vy: (Math.random() - 0.8) * speed,
                    life: 0.3 + Math.random() * 0.4,
                    maxLife: 0.3 + Math.random() * 0.4,
                    color: color,
                    size: 2 + Math.random() * 5,
                    type: Math.random() > 0.5 ? 'square' : 'circle'
                });
            }
        }
        
        function update(dt) {
            if (gameState !== 'playing') return;
            gameTime += dt;
            
            if (screenShake > 0) screenShake -= dt * 15;
            if (screenFlash > 0) screenFlash -= dt * 8;
            if (comboTimer > 0) {
                comboTimer -= dt;
                if (comboTimer <= 0) combo = 0;
            }
            
            // Player input
            let moveX = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
            if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
            
            const running = keys['ShiftLeft'] || keys['ShiftRight'];
            const actualSpeed = running ? player.speed * 1.4 : player.speed;
            
            player.vx = moveX * actualSpeed;
            if (moveX !== 0) player.facing = moveX;
            
            // Jump
            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && player.grounded) {
                player.vy = player.jumpForce;
                player.grounded = false;
                spawnParticles(player.x + player.width/2, player.y + player.height, 8, COLORS.secondary, 150);
            }
            
            // Attack
            if ((keys['KeyX'] || keys['KeyZ'] || keys['KeyJ'] || keys['KeyE']) && 
                player.attackCooldown <= 0 && !player.attacking) {
                player.attacking = true;
                player.attackTimer = 0.35;
                player.attackCooldown = 0.45;
                player.attackPhase = 0;
                player.state = 'attack';
                
                // Check hits
                const hitBox = {
                    x: player.facing > 0 ? player.x + player.width - 5 : player.x - 55,
                    y: player.y - 5,
                    w: 60, h: player.height + 10
                };
                
                let hitCount = 0;
                enemies.forEach(enemy => {
                    if (!enemy.alive || enemy.hitTimer > 0) return;
                    
                    if (hitBox.x < enemy.x + enemy.width &&
                        hitBox.x + hitBox.w > enemy.x &&
                        hitBox.y < enemy.y + enemy.height &&
                        hitBox.y + hitBox.h > enemy.y) {
                        
                        const damage = 22 + Math.floor(Math.random() * 12);
                        enemy.health -= damage;
                        enemy.hitTimer = 0.4;
                        enemy.vx = player.facing * (250 + Math.random() * 80);
                        enemy.vy = -150 - Math.random() * 50;
                        enemy.state = 'hit';
                        
                        score += damage;
                        combo++;
                        comboTimer = 2.5;
                        hitCount++;
                        
                        spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, 
                            12 + Math.floor(Math.random() * 6), COLORS.accent, 250);
                        spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2,
                            5, '#ffffff', 150);
                        screenShake = 4 + Math.min(hitCount, 3);
                        
                        if (enemy.health <= 0) {
                            enemy.alive = false;
                            score += 150 + combo * 10;
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, 
                                25, COLORS.primary, 300);
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2,
                                15, COLORS.accent, 200);
                            screenShake = 8;
                            screenFlash = 0.3;
                        }
                    }
                });
            }
            
            if (player.attackTimer > 0) {
                player.attackTimer -= dt;
                player.attackPhase = 1 - (player.attackTimer / 0.35);
                if (player.attackTimer <= 0) {
                    player.attacking = false;
                }
            }
            
            if (player.attackCooldown > 0) player.attackCooldown -= dt;
            if (player.invincible > 0) player.invincible -= dt;
            
            // Player physics
            player.vy += 1400 * dt;
            player.x += player.vx * dt;
            player.y += player.vy * dt;
            
            if (player.x < 0) player.x = 0;
            if (player.x > levelWidth - player.width) player.x = levelWidth - player.width;
            
            // Platform collision
            player.grounded = false;
            platforms.forEach(plat => {
                if (player.vy >= 0 &&
                    player.x + player.width > plat.x &&
                    player.x < plat.x + plat.w &&
                    player.y + player.height > plat.y &&
                    player.y + player.height < plat.y + plat.h + player.vy * dt + 15) {
                    player.y = plat.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            });
            
            if (player.y > 650) {
                lives--;
                if (lives <= 0) {
                    gameState = 'gameover';
                } else {
                    player.health = player.maxHealth;
                    player.x = Math.max(100, cameraX);
                    player.y = 280;
                    player.vy = 0;
                    player.invincible = 2;
                }
            }
            
            // Player animation
            player.animTimer += dt;
            if (player.animTimer > 0.08) {
                player.animTimer = 0;
                player.animFrame = (player.animFrame + 1) % 6;
            }
            
            if (player.attacking) {
                player.state = 'attack';
            } else if (!player.grounded) {
                player.state = 'jump';
            } else if (Math.abs(player.vx) > 10) {
                player.state = player.vx !== player.speed ? 'walk' : 'run';
            } else {
                player.state = 'idle';
            }
            
            // Update enemies
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                
                if (enemy.hitTimer > 0) {
                    enemy.hitTimer -= dt;
                    enemy.vy += 1400 * dt;
                    enemy.y += enemy.vy * dt;
                    enemy.x += enemy.vx * dt;
                    enemy.vx *= 0.95;
                    
                    platforms.forEach(plat => {
                        if (enemy.vy >= 0 &&
                            enemy.x + enemy.width > plat.x &&
                            enemy.x < plat.x + plat.w &&
                            enemy.y + enemy.height > plat.y &&
                            enemy.y + enemy.height < plat.y + plat.h + 25) {
                            enemy.y = plat.y - enemy.height;
                            enemy.vy = 0;
                        }
                    });
                    return;
                }
                
                const dx = player.x - enemy.x;
                const dy = player.y - enemy.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist < 280) {
                    enemy.state = 'chase';
                    enemy.facing = dx > 0 ? 1 : -1;
                    
                    if (dist > 55) {
                        enemy.vx = enemy.facing * enemy.speed;
                    } else {
                        enemy.vx *= 0.85;
                    }
                    
                    if (dist < 65 && enemy.attackCooldown <= 0 && player.invincible <= 0) {
                        const dmg = 12 + Math.floor(Math.random() * 8);
                        player.health -= dmg;
                        player.invincible = 1.2;
                        player.vx = enemy.facing * -180;
                        player.vy = -80;
                        screenShake = 6;
                        screenFlash = 0.2;
                        spawnParticles(player.x + player.width/2, player.y + player.height/2, 
                            10, '#ff0000', 200);
                        
                        if (player.health <= 0) {
                            lives--;
                            if (lives <= 0) {
                                gameState = 'gameover';
                            } else {
                                player.health = player.maxHealth;
                                player.x = Math.max(100, cameraX);
                                player.y = 280;
                                player.invincible = 2;
                            }
                        }
                        enemy.attackCooldown = 1.8 + Math.random() * 0.5;
                        combo = 0;
                    }
                } else {
                    enemy.state = 'patrol';
                    enemy.patrolTimer += dt;
                    if (enemy.patrolTimer > 2.5 + Math.random()) {
                        enemy.patrolTimer = 0;
                        enemy.patrolDir *= -1;
                    }
                    enemy.vx = enemy.patrolDir * enemy.speed * 0.4;
                    enemy.facing = enemy.patrolDir;
                }
                
                if (enemy.attackCooldown > 0) enemy.attackCooldown -= dt;
                
                // Enemy physics
                enemy.vy += 1400 * dt;
                enemy.y += enemy.vy * dt;
                enemy.x += enemy.vx * dt;
                
                if (enemy.x < 0) { enemy.x = 0; enemy.patrolDir = 1; }
                if (enemy.x > levelWidth - enemy.width) { 
                    enemy.x = levelWidth - enemy.width; 
                    enemy.patrolDir = -1; 
                }
                
                platforms.forEach(plat => {
                    if (enemy.vy >= 0 &&
                        enemy.x + enemy.width > plat.x &&
                        enemy.x < plat.x + plat.w &&
                        enemy.y + enemy.height > plat.y &&
                        enemy.y + enemy.height < plat.y + plat.h + 25) {
                        enemy.y = plat.y - enemy.height;
                        enemy.vy = 0;
                    }
                });
                
                enemy.animTimer += dt;
                if (enemy.animTimer > 0.12) {
                    enemy.animTimer = 0;
                    enemy.animFrame = (enemy.animFrame + 1) % 4;
                }
            });
            
            // Camera
            const targetX = player.x - canvas.width / 2 + player.width / 2;
            cameraX += (targetX - cameraX) * 4 * dt;
            cameraX = Math.max(0, Math.min(levelWidth - canvas.width, cameraX));
            
            // Particles
            particles = particles.filter(p => {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += 500 * dt;
                p.life -= dt;
                return p.life > 0;
            });
            
            // Win check
            if (enemies.every(e => !e.alive)) {
                gameState = 'win';
            }
        }
        
        function draw() {
            // Screen flash
            if (screenFlash > 0) {
                ctx.fillStyle = `rgba(255, 255, 255, ${screenFlash * 0.5})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            if (gameState === 'start') {
                drawStartScreen();
                return;
            }
            
            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#0a0300');
            skyGrad.addColorStop(0.5, '#1a0800');
            skyGrad.addColorStop(1, '#2a1000');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (gameState === 'gameover') {
                drawGameOver();
                return;
            }
            
            if (gameState === 'win') {
                drawWin();
                return;
            }
            
            ctx.save();
            const sx = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2.5 : 0;
            const sy = screenShake > 0 ? (Math.random() - 0.5) * screenShake * 2.5 : 0;
            ctx.translate(-cameraX + sx, sy);
            
            // Background buildings
            bgBuildings.forEach(b => {
                const px = b.x - cameraX * 0.3;
                if (px > -b.w - 50 && px < canvas.width + 100) {
                    ctx.fillStyle = b.color;
                    ctx.fillRect(px, 460 - b.h, b.w, b.h + 100);
                    
                    // Windows
                    const winW = 8, winH = 12, gap = 12;
                    for (let row = 0; row < Math.floor(b.h / 30); row++) {
                        for (let col = 0; col < Math.floor(b.w / 20); col++) {
                            const wi = row * 3 + col;
                            ctx.fillStyle = b.litWindows[wi % b.litWindows.length] ? 
                                `rgba(255, 180, 80, ${0.3 + Math.random() * 0.3})` : '#0a0500';
                            ctx.fillRect(px + 8 + col * (winW + gap), 
                                455 - b.h + 15 + row * 28, winW, winH);
                        }
                    }
                }
            });
            
            // Middle buildings
            bgBuildings.forEach((b, i) => {
                if (i % 3 !== 1) return;
                const px = b.x - cameraX * 0.5;
                if (px > -b.w - 50 && px < canvas.width + 100) {
                    ctx.fillStyle = `hsl(25, 50%, ${12 + (i % 3) * 3}%)`;
                    ctx.fillRect(px, 460 - b.h * 0.8, b.w * 0.9, b.h * 0.8 + 100);
                }
            });
            
            // Decorations
            decorations.forEach(d => {
                if (d.x < cameraX - 100 || d.x > cameraX + canvas.width + 100) return;
                if (d.type === 'lamp') {
                    ctx.fillStyle = '#2a1500';
                    ctx.fillRect(d.x, d.y - 80, 6, 80);
                    ctx.fillStyle = COLORS.accent;
                    ctx.beginPath();
                    ctx.arc(d.x + 3, d.y - 85, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = 'rgba(255, 150, 0, 0.15)';
                    ctx.beginPath();
                    ctx.arc(d.x + 3, d.y - 85, 40, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#3a2000';
                    ctx.fillRect(d.x - 20, d.y - 30, 40, 30);
                    ctx.fillStyle = '#4a2800';
                    ctx.fillRect(d.x - 15, d.y - 40, 30, 15);
                }
            });
            
            // Platforms
            platforms.forEach(plat => {
                if (plat.x + plat.w < cameraX - 50 || plat.x > cameraX + canvas.width + 50) return;
                
                if (plat.type === 'ground') {
                    // Main ground
                    ctx.fillStyle = '#2a1500';
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    
                    // Sidewalk
                    ctx.fillStyle = '#3d2000';
                    ctx.fillRect(plat.x, plat.y - 8, plat.w, 12);
                    ctx.fillStyle = '#4d2800';
                    ctx.fillRect(plat.x, plat.y - 8, plat.w, 3);
                    
                    // Road markings
                    ctx.fillStyle = '#5a4a00';
                    for (let x = plat.x; x < plat.x + plat.w; x += 120) {
                        ctx.fillRect(x, plat.y + 50, 60, 6);
                    }
                } else {
                    // Building roof/platform
                    ctx.fillStyle = '#4a2500';
                    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
                    ctx.fillStyle = '#5a3010';
                    ctx.fillRect(plat.x - 4, plat.y, plat.w + 8, 10);
                    ctx.fillStyle = '#3a1a00';
                    ctx.fillRect(plat.x, plat.y + plat.h - 4, plat.w, 4);
                    
                    // Edge detail
                    for (let x = plat.x; x < plat.x + plat.w; x += 20) {
                        ctx.fillStyle = '#6a3818';
                        ctx.fillRect(x, plat.y + 2, 10, 4);
                    }
                }
            });
            
            // Enemies
            enemies.forEach(enemy => {
                if (!enemy.alive) return;
                if (enemy.x + enemy.width < cameraX - 50 || enemy.x > cameraX + canvas.width + 50) return;
                
                ctx.save();
                ctx.translate(enemy.x + enemy.width/2, enemy.y);
                ctx.scale(enemy.facing, 1);
                
                const flashAlpha = enemy.hitTimer > 0 ? 0.7 : 0;
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(0, enemy.height + 5, 18, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Body
                ctx.fillStyle = flashAlpha > 0 ? '#ff4444' : (enemy.type === 0 ? '#774422' : '#885533');
                ctx.fillRect(-16, 14, 32, 36);
                
                // Jacket
                ctx.fillStyle = flashAlpha > 0 ? '#ff2222' : (enemy.type === 0 ? '#553311' : '#664422');
                ctx.fillRect(-16, 14, 10, 36);
                ctx.fillRect(6, 14, 10, 36);
                
                // Head
                ctx.fillStyle = flashAlpha > 0 ? '#ffaaaa' : '#cc9966';
                ctx.beginPath();
                ctx.arc(0, 8, 13, 0, Math.PI * 2);
                ctx.fill();
                
                // Hair
                ctx.fillStyle = flashAlpha > 0 ? '#ff6666' : '#332211';
                ctx.beginPath();
                ctx.arc(0, 4, 13, Math.PI, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = flashAlpha > 0 ? '#ffffff' : '#aa0000';
                ctx.fillRect(3, 6, 4, 4);
                
                // Arms
                const armSwing = Math.sin(enemy.animFrame * 0.8) * 3;
                ctx.fillStyle = flashAlpha > 0 ? '#ff4444' : (enemy.type === 0 ? '#553311' : '#664422');
                ctx.fillRect(14, 18 + armSwing, 12, 8);
                ctx.fillRect(-26, 18 - armSwing, 12, 8);
                
                // Legs
                ctx.fillStyle = flashAlpha > 0 ? '#882222' : '#3a2211';
                const legOff = Math.sin(enemy.animFrame * 1.2) * 6;
                ctx.fillRect(-13, 50, 11, 18 + legOff);
                ctx.fillRect(2, 50, 11, 18 - legOff);
                
                ctx.restore();
                
                // Health bar
                if (enemy.health < enemy.maxHealth) {
                    const bw = 40;
                    ctx.fillStyle = '#220000';
                    ctx.fillRect(enemy.x + enemy.width/2 - bw/2, enemy.y - 18, bw, 7);
                    ctx.fillStyle = '#ff2200';
                    ctx.fillRect(enemy.x + enemy.width/2 - bw/2, enemy.y - 18, 
                        bw * (enemy.health / enemy.maxHealth), 7);
                }
            });
            
            // Player
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y);
            ctx.scale(player.facing, 1);
            
            if (player.invincible > 0 && Math.floor(player.invincible * 12) % 2 === 0) {
                ctx.globalAlpha = 0.4;
            }
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(0, player.height + 3, 20, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Legs with animation
            const legAnim = player.state === 'walk' ? Math.sin(player.animFrame * 1.5) * 8 :
                           player.state === 'run' ? Math.sin(player.animFrame * 2) * 10 : 0;
            const jumpLeg = !player.grounded ? 5 : 0;
            
            ctx.fillStyle = '#2a1800';
            ctx.fillRect(-14, 50 + jumpLeg, 12, 22 - jumpLeg + legAnim);
            ctx.fillRect(2, 50 + jumpLeg, 12, 22 - jumpLeg - legAnim);
            
            // Shoes
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(-16, 68 + legAnim, 16, 9);
            ctx.fillRect(0, 68 - legAnim, 16, 9);
            
            // Body
            ctx.fillStyle = COLORS.primary;
            ctx.fillRect(-18, 12, 36, 40);
            
            // Jacket details
            ctx.fillStyle = COLORS.secondary;
            ctx.fillRect(-18, 12, 8, 40);
            ctx.fillRect(10, 12, 8, 40);
            
            // Belt
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(-18, 48, 36, 5);
            ctx.fillStyle = COLORS.accent;
            ctx.fillRect(-3, 48, 6, 5);
            
            // Head
            ctx.fillStyle = '#ffcc88';
            ctx.beginPath();
            ctx.arc(0, 6, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Hair
            ctx.fillStyle = '#3a2010';
            ctx.beginPath();
            ctx.arc(0, 2, 15, Math.PI, Math.PI * 2);
            ctx.fill();
            
            // Headband
            ctx.fillStyle = COLORS.accent;
            ctx.fillRect(-15, 0, 30, 4);
            
            // Eyes
            ctx.fillStyle = '#222222';
            ctx.fillRect(4, 4, 5, 5);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(6, 5, 2, 2);
            
            // Arms
            if (player.attacking) {
                // Extended punch arm
                const punchExtend = Math.sin(player.attackPhase * Math.PI) * 35;
                ctx.fillStyle = COLORS.accent;
                ctx.fillRect(15, 18, punchExtend + 15, 14);
                
                // Fist
                ctx.fillStyle = '#ffcc88';
                ctx.beginPath();
                ctx.arc(30 + punchExtend, 25, 10, 0, Math.PI * 2);
                ctx.fill();
                
                // Punch effect
                if (punchExtend > 20) {
                    ctx.strokeStyle = COLORS.accent;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(35 + punchExtend, 25, 18, -0.5, 0.5);
                    ctx.stroke();
                }
                
                ctx.fillStyle = COLORS.primary;
                ctx.fillRect(-30, 20, 15, 12);
            } else {
                const armSwing = Math.sin(player.animFrame * 1.2) * 4;
                ctx.fillStyle = COLORS.secondary;
                ctx.fillRect(15, 18 + armSwing, 14, 10);
                ctx.fillRect(-29, 18 - armSwing, 14, 10);
            }
            
            ctx.restore();
            
            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life / p.maxLife;
                ctx.fillStyle = p.color;
                if (p.type === 'circle') {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
                }
            });
            ctx.globalAlpha = 1;
            
            ctx.restore();
            
            // HUD
            drawHUD();
        }
        
        function drawHUD() {
            // Health bar background with border
            ctx.fillStyle = '#1a0000';
            ctx.fillRect(18, 18, 204, 28);
            ctx.strokeStyle = COLORS.secondary;
            ctx.lineWidth = 2;
            ctx.strokeRect(18, 18, 204, 28);
            
            // Health bar
            const healthPct = player.health / player.maxHealth;
            const healthGrad = ctx.createLinearGradient(20, 0, 220, 0);
            healthGrad.addColorStop(0, '#ff2200');
            healthGrad.addColorStop(0.5, '#ff6600');
            healthGrad.addColorStop(1, '#ff9900');
            ctx.fillStyle = healthGrad;
            ctx.fillRect(20, 20, 200 * healthPct, 24);
            
            // Health text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px "Courier New"';
            ctx.textAlign = 'left';
            ctx.fillText('HP', 26, 37);
            
            // Lives
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 22px "Courier New"';
            ctx.fillText('♥', 235, 38);
            ctx.fillText('x' + lives, 255, 38);
            
            // Score panel
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(canvas.width - 220, 15, 205, 50);
            ctx.strokeStyle = COLORS.secondary;
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width - 220, 15, 205, 50);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 14px "Courier New"';
            ctx.textAlign = 'right';
            ctx.fillText('СЧЁТ', canvas.width - 30, 32);
            ctx.font = 'bold 26px "Courier New"';
            ctx.fillText(score.toString().padStart(8, '0'), canvas.width - 30, 56);
            
            // Combo display
            if (combo > 1) {
                const comboSize = Math.min(28 + combo * 2, 48);
                ctx.fillStyle = COLORS.accent;
                ctx.font = `bold ${comboSize}px "Courier New"`;
                ctx.textAlign = 'center';
                ctx.fillText(combo + 'x COMBO!', canvas.width / 2, 50);
                
                ctx.fillStyle = COLORS.text;
                ctx.font = '16px "Courier New"';
                ctx.fillText('+' + (combo * 5) + ' бонус', canvas.width / 2, 72);
            }
            
            // Enemies remaining
            const alive = enemies.filter(e => e.alive).length;
            ctx.fillStyle = '#888888';
            ctx.font = '16px "Courier New"';
            ctx.textAlign = 'left';
            ctx.fillText('БАНДИТОВ: ' + alive, 20, 68);
            
            // Progress bar
            const progress = 1 - (alive / enemies.length);
            ctx.fillStyle = '#333333';
            ctx.fillRect(20, 75, 150, 8);
            ctx.fillStyle = COLORS.primary;
            ctx.fillRect(20, 75, 150 * progress, 8);
            ctx.fillStyle = '#888';
            ctx.font = '12px "Courier New"';
            ctx.fillText('ПРОГРЕСС', 175, 84);
        }
        
        function drawStartScreen() {
            // Background
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0a0300');
            grad.addColorStop(1, '#2a1000');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // City silhouette
            ctx.fillStyle = '#1a0800';
            for (let x = -20; x < canvas.width + 40; x += 50) {
                const h = 80 + Math.sin(x * 0.03) * 40 + Math.cos(x * 0.05) * 30;
                ctx.fillRect(x, canvas.height - h - 80, 45, h);
            }
            
            // Neon sign effect
            ctx.fillStyle = COLORS.primary;
            ctx.globalAlpha = 0.3 + Math.sin(Date.now() * 0.003) * 0.2;
            ctx.fillRect(canvas.width/2 - 200, 140, 400, 100);
            ctx.globalAlpha = 1;
            
            // Title
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 78px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('УЛИЦЫ 90-х', canvas.width/2, 200);
            
            // Subtitle glow
            ctx.fillStyle = COLORS.primary;
            ctx.font = 'bold 32px "Courier New"';
            ctx.fillText('БЕЙ ИХ ВСЕХ!', canvas.width/2, 250);
            
            // Animated character
            const charX = canvas.width/2;
            const charY = 360;
            const bob = Math.sin(Date.now() * 0.004) * 5;
            
            ctx.save();
            ctx.translate(charX, charY + bob);
            ctx.scale(2.5, 2.5);
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(0, 68, 22, 8, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Legs
            ctx.fillStyle = '#2a1800';
            ctx.fillRect(-14, 50, 12, 22);
            ctx.fillRect(2, 50, 12, 22);
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(-16, 68, 16, 9);
            ctx.fillRect(0, 68, 16, 9);
            
            // Body
            ctx.fillStyle = COLORS.primary;
            ctx.fillRect(-18, 12, 36, 40);
            ctx.fillStyle = COLORS.secondary;
            ctx.fillRect(-18, 12, 8, 40);
            ctx.fillRect(10, 12, 8, 40);
            ctx.fillStyle = '#1a0a00';
            ctx.fillRect(-18, 48, 36, 5);
            ctx.fillStyle = COLORS.accent;
            ctx.fillRect(-3, 48, 6, 5);
            
            // Head
            ctx.fillStyle = '#ffcc88';
            ctx.beginPath();
            ctx.arc(0, 6, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#3a2010';
            ctx.beginPath();
            ctx.arc(0, 2, 15, Math.PI, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = COLORS.accent;
            ctx.fillRect(-15, 0, 30, 4);
            ctx.fillStyle = '#222';
            ctx.fillRect(4, 4, 5, 5);
            
            // Fist pump
            ctx.fillStyle = COLORS.secondary;
            ctx.fillRect(15, 15, 20, 12);
            ctx.fillStyle = '#ffcc88';
            ctx.beginPath();
            ctx.arc(35, 21, 9, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Controls
            ctx.fillStyle = COLORS.text;
            ctx.font = '18px "Courier New"';
            ctx.fillText('← → / A D - ДВИЖЕНИЕ', canvas.width/2, 460);
            ctx.fillText('ПРОБЕЛ / W / ↑ - ПРЫЖОК', canvas.width/2, 485);
            ctx.fillText('X / Z / J - АТАКА', canvas.width/2, 510);
            
            // Start prompt
            ctx.fillStyle = COLORS.accent;
            ctx.font = 'bold 26px "Courier New"';
            const blink = Math.sin(Date.now() * 0.005) > 0;
            if (blink) {
                ctx.fillText('[ НАЖМИ SPACE ИЛИ ENTER ]', canvas.width/2, 540);
            }
        }
        
        function drawGameOver() {
            ctx.fillStyle = 'rgba(20, 0, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Glitch effect
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.1})`;
                ctx.fillRect(0, Math.random() * canvas.height, canvas.width, 3);
            }
            
            ctx.fillStyle = '#ff2200';
            ctx.font = 'bold 72px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width/2, 200);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = '28px "Courier New"';
            ctx.fillText('Финальный счёт: ' + score, canvas.width/2, 280);
            
            ctx.fillStyle = '#888888';
            ctx.font = '20px "Courier New"';
            ctx.fillText('Время: ' + Math.floor(gameTime) + ' сек', canvas.width/2, 320);
            
            ctx.fillStyle = COLORS.accent;
            ctx.font = 'bold 24px "Courier New"';
            ctx.fillText('[ SPACE/ENTER - ЗАНОВО ]', canvas.width/2, 400);
        }
        
        function drawWin() {
            ctx.fillStyle = 'rgba(0, 30, 0, 0.9)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Victory particles
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = `hsl(${40 + Math.random() * 20}, 100%, ${50 + Math.random() * 30}%)`;
                ctx.globalAlpha = 0.6;
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.fillRect(x, y, 4, 4);
            }
            ctx.globalAlpha = 1;
            
            ctx.fillStyle = COLORS.text;
            ctx.font = 'bold 72px "Courier New"';
            ctx.textAlign = 'center';
            ctx.fillText('ПОБЕДА!', canvas.width/2, 180);
            
            ctx.fillStyle = COLORS.accent;
            ctx.font = '28px "Courier New"';
            ctx.fillText('Все бандиты повержены!', canvas.width/2, 240);
            
            ctx.fillStyle = COLORS.primary;
            ctx.font = 'bold 42px "Courier New"';
            ctx.fillText('ИТОГО: ' + score + ' ОЧКОВ', canvas.width/2, 320);
            
            ctx.fillStyle = '#888888';
            ctx.font = '20px "Courier New"';
            ctx.fillText('Время прохождения: ' + Math.floor(gameTime) + ' сек', canvas.width/2, 370);
            ctx.fillText('Максимальный комбо: ' + combo + 'x', canvas.width/2, 400);
            
            ctx.fillStyle = COLORS.text;
            ctx.font = '22px "Courier New"';
            ctx.fillText('[ ENTER - В МЕНЮ ]', canvas.width/2, 480);
        }
        
        function gameLoop(timestamp) {
            const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;
            
            update(dt);
            draw();
            
            requestAnimationFrame(gameLoop);
        }
        
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
