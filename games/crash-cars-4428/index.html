<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crash Cars — Летающие тачки</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #ui { color: #ff6600; text-align: center; margin-bottom: 6px; }
    #score { font-size: 20px; letter-spacing: 3px; color: #ffaa00; }
    #level-info { font-size: 13px; color: #888; margin-top: 3px; }
    canvas {
      border: 3px solid #7a3f00;
      display: block;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="score">ОЧКИ: 0</div>
    <div id="level-info">Залп: 3 тачки | ENTER — стрелять</div>
  </div>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      const s = Math.min(window.innerWidth - 40, window.innerHeight - 100, 900);
      canvas.width = s;
      canvas.height = s * 0.55;
    }

    let W, H;
    resize();
    W = canvas.width;
    H = canvas.height;

    let gameState = 'AIM';
    let score = 0;
    let level = 1;
    const MAX_SHOTS = 3;

    let slingshot = { x: W * 0.12, y: H * 0.75 };
    let currentCar = null;
    let cars = [];
    let projectiles = [];
    let debris = [];
    let targets = [];
    let trajectoryPoints = [];

    let aimAngle = Math.PI / 4;
    let aimPower = 50;
    let dragging = false;
    let dragStart = { x: 0, y: 0 };

    class Car {
      constructor(x, y, size, color, hp) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.color = color;
        this.hp = hp;
        this.maxHp = hp;
        this.vx = 0;
        this.vy = 0;
        this.rotation = 0;
        this.rotationSpeed = 0;
        this.landed = false;
        this.wheelOffset = 0;
      }

      update() {
        if (!this.landed) {
          this.vy += 0.35;
          this.x += this.vx;
          this.y += this.vy;
          this.rotation += this.rotationSpeed;
          this.rotationSpeed *= 0.98;
          this.wheelOffset += 0.2;

          const groundY = H * 0.88;
          if (this.y + this.size > groundY) {
            this.y = groundY - this.size;
            this.vy *= -0.4;
            this.vx *= 0.7;
            if (Math.abs(this.vy) < 1) {
              this.vy = 0;
              this.landed = true;
              this.rotation = 0;
              this.rotationSpeed = 0;
            }
          }

          if (this.x < -this.size || this.x > W + this.size || this.y > H + this.size) {
            this.hp = 0;
          }
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x + this.size/2, this.y + this.size/2);
        ctx.rotate(this.rotation);

        // Body
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size/2, -this.size/3, this.size, this.size/1.5);

        // Roof
        ctx.fillStyle = this.shadeColor(this.color, -30);
        ctx.fillRect(-this.size/4, -this.size/2, this.size/2, this.size/4);

        // Windows
        ctx.fillStyle = '#88ccff';
        ctx.fillRect(-this.size/5, -this.size/2.5, this.size/4, this.size/5);
        ctx.fillRect(this.size/10, -this.size/2.5, this.size/4, this.size/5);

        // Wheels
        const wR = this.size / 5;
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(-this.size/3, this.size/3 + Math.sin(this.wheelOffset) * (this.landed ? 0 : 2), wR, 0, Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(this.size/3, this.size/3 + Math.sin(this.wheelOffset) * (this.landed ? 0 : 2), wR, 0, Math.PI*2);
        ctx.fill();

        // Bumper
        ctx.fillStyle = '#666';
        ctx.fillRect(-this.size/2 - 3, -this.size/4, 4, this.size/2);

        // Headlight
        ctx.fillStyle = '#ffff88';
        ctx.fillRect(this.size/2 - 4, -this.size/6, 4, this.size/4);

        ctx.restore();

        // HP bar
        if (this.hp < this.maxHp) {
          ctx.fillStyle = '#333';
          ctx.fillRect(this.x, this.y - 10, this.size, 5);
          ctx.fillStyle = this.hp > this.maxHp * 0.3 ? '#44ff44' : '#ff4444';
          ctx.fillRect(this.x, this.y - 10, this.size * (this.hp / this.maxHp), 5);
        }
      }

      shadeColor(c, v) {
        const h = parseInt(c.slice(1), 16);
        const r = Math.max(0, Math.min(255, ((h >> 16) & 0xff) + v));
        const g = Math.max(0, Math.min(255, ((h >> 8) & 0xff) + v));
        const b = Math.max(0, Math.min(255, (h & 0xff) + v));
        return `rgb(${r},${g},${b})`;
      }

      hit(damage, hitVx, hitVy) {
        this.hp -= damage;
        this.vx += hitVx;
        this.vy += hitVy;
        this.rotationSpeed += (Math.random() - 0.5) * 0.3;
        this.landed = false;
        score += 10;
      }
    }

    class Debris {
      constructor(x, y, vx, vy, size, color) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.size = size;
        this.color = color;
        this.life = 60 + Math.random() * 40;
        this.maxLife = this.life;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.2;
      }

      update() {
        this.vy += 0.3;
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.rotSpeed;
        this.life--;
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.restore();
        ctx.globalAlpha = 1;
      }
    }

    function createTargets() {
      targets = [];
      const baseX = W * 0.65;
      const groundY = H * 0.88;

      const patterns = [
        { type: 'tower', count: 3 },
        { type: 'wall', count: 4 },
        { type: 'fort', count: 5 }
      ];

      const p = patterns[Math.min(level - 1, patterns.length - 1)];

      for (let i = 0; i < p.count; i++) {
        const size = 25 + Math.random() * 20;
        const colors = ['#cc3333', '#3333cc', '#33cc33', '#cccc33', '#cc6633'];
        const color = colors[i % colors.length];
        const hp = 2 + Math.floor(Math.random() * 2);
        const x = baseX + (i % 2) * size * 1.5 + Math.random() * 20;
        const y = groundY - size - (i > 2 ? size * 2 : 0);
        targets.push(new Car(x, y, size, color, hp));
      }
    }

    function spawnDebris(x, y, count, baseColor) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 6;
        const size = 4 + Math.random() * 8;
        const colors = [baseColor, '#888', '#555', '#ff6600'];
        debris.push(new Debris(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - 3, size, colors[Math.floor(Math.random() * colors.length)]));
      }
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#0a1628');
      grad.addColorStop(0.6, '#1a3a5c');
      grad.addColorStop(1, '#2a5a3c');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Stars
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 30; i++) {
        const sx = (i * 137.5) % W;
        const sy = (i * 73.3) % (H * 0.5);
        ctx.fillRect(sx, sy, 2, 2);
      }

      // Moon
      ctx.fillStyle = '#ffeebb';
      ctx.beginPath();
      ctx.arc(W * 0.85, H * 0.15, 30, 0, Math.PI * 2);
      ctx.fill();

      // Ground
      ctx.fillStyle = '#2d5a1e';
      ctx.fillRect(0, H * 0.88, W, H * 0.12);
      ctx.fillStyle = '#3d7a2e';
      ctx.fillRect(0, H * 0.88, W, 5);

      // Slingshot tree
      ctx.fillStyle = '#4a2a0a';
      ctx.fillRect(slingshot.x - 8, slingshot.y - 80, 16, 80);
      ctx.fillStyle = '#2a4a1a';
      ctx.beginPath();
      ctx.arc(slingshot.x, slingshot.y - 90, 40, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(slingshot.x - 25, slingshot.y - 70, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(slingshot.x + 25, slingshot.y - 70, 30, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSlingshot() {
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(slingshot.x - 5, slingshot.y - 40, 5, 40);
      ctx.fillRect(slingshot.x + 20, slingshot.y - 40, 5, 40);

      // Band
      if (currentCar && dragging) {
        ctx.strokeStyle = '#884400';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(slingshot.x, slingshot.y - 35);
        ctx.lineTo(currentCar.x + currentCar.size/2, currentCar.y + currentCar.size/2);
        ctx.lineTo(slingshot.x + 20, slingshot.y - 35);
        ctx.stroke();
      } else if (currentCar) {
        ctx.strokeStyle = '#884400';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(slingshot.x, slingshot.y - 35);
        ctx.lineTo(currentCar.x + currentCar.size/2, currentCar.y + currentCar.size/2);
        ctx.lineTo(slingshot.x + 20, slingshot.y - 35);
        ctx.stroke();
      }
    }

    function drawTrajectory() {
      if (!currentCar || !dragging) return;

      const startX = currentCar.x + currentCar.size/2;
      const startY = currentCar.y + currentCar.size/2;

      ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
      for (let i = 0; i < trajectoryPoints.length; i++) {
        const p = trajectoryPoints[i];
        const alpha = 1 - i / trajectoryPoints.length;
        ctx.globalAlpha = alpha * 0.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4 - i * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawUI() {
      ctx.fillStyle = '#ffaa00';
      ctx.font = 'bold 18px Courier New';
      ctx.fillText('ОЧКИ: ' + score, 20, 30);

      ctx.fillStyle = '#888';
      ctx.font = '14px Courier New';
      ctx.fillText('Залп: ' + (MAX_SHOTS - projectiles.length), 20, 50);
      ctx.fillText('Уровень: ' + level, W - 100, 30);
    }

    function checkCollisions() {
      for (let p of projectiles) {
        for (let t of targets) {
          if (t.hp <= 0) continue;
          const dx = (p.x + p.size/2) - (t.x + t.size/2);
          const dy = (p.y + p.size/2) - (t.y + t.size/2);
          const dist = Math.sqrt(dx*dx + dy*dy);

          if (dist < p.size/2 + t.size/2) {
            const damage = 1 + Math.floor(Math.abs(p.vx) / 5);
            t.hit(damage, p.vx * 0.3, p.vy * 0.3);
            spawnDebris(p.x, p.y, 8, p.color);

            p.vx *= 0.3;
            p.vy *= 0.3;

            if (t.hp <= 0) {
              spawnDebris(t.x + t.size/2, t.y + t.size/2, 15, t.color);
              score += 200;
            }
          }
        }

        for (let t of targets) {
          for (let other of targets) {
            if (t === other || t.hp <= 0 || other.hp <= 0) continue;
            const dx = (t.x + t.size/2) - (other.x + other.size/2);
            const dy = (t.y + t.size/2) - (other.y + other.size/2);
            const dist = Math.sqrt(dx*dx + dy*dy);

            if (dist < t.size + other.size && (Math.abs(t.vx) > 2 || Math.abs(t.vy) > 2)) {
              other.hit(1, t.vx * 0.5, t.vy * 0.5);
              if (other.hp <= 0) {
                spawnDebris(other.x + other.size/2, other.y + other.size/2, 12, other.color);
                score += 150;
              }
            }
          }
        }
      }
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (currentCar && !dragging) {
        projectiles.push(currentCar);
        currentCar = null;
      }

      for (let p of projectiles) {
        p.update();
      }

      for (let t of targets) {
        t.update();
      }

      for (let d of debris) {
        d.update();
      }

      checkCollisions();

      projectiles = projectiles.filter(p => p.hp > 0 && p.y < H + 100);
      targets = targets.filter(t => t.hp > 0);
      debris = debris.filter(d => d.life > 0);

      if (projectiles.length >= MAX_SHOTS && projectiles.every(p => p.landed || p.y > H)) {
        setTimeout(() => {
          if (targets.length === 0) {
            level++;
            score += 500;
          }
          nextTurn();
        }, 800);
        gameState = 'WAIT';
      }

      trajectoryPoints = [];
      if (dragging && currentCar) {
        const px = currentCar.x + currentCar.size/2;
        const py = currentCar.y + currentCar.size/2;
        const angle = Math.atan2(slingshot.y - 35 - py, slingshot.x + 10 - px);
        const power = Math.min(80, Math.sqrt(Math.pow(slingshot.x + 10 - px, 2) + Math.pow(slingshot.y - 35 - py, 2)) * 1.5);

        for (let i = 0; i < 25; i++) {
          const t = i * 0.15;
          const tx = slingshot.x + 10 + Math.cos(angle) * power * t;
          const ty = slingshot.y - 35 + Math.sin(angle) * power * t + 0.5 * 15 * t * t;
          trajectoryPoints.push({ x: tx, y: ty });
          if (ty > H * 0.88) break;
        }
      }
    }

    function render() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawSlingshot();
      drawTrajectory();

      for (let d of debris) d.draw();
      for (let t of targets) t.draw();
      for (let p of projectiles) p.draw();
      if (currentCar && !dragging) currentCar.draw();

      drawUI();

      if (gameState === 'AIM' && !currentCar) {
        currentCar = new Car(slingshot.x - 15, slingshot.y - 60, 30, '#ee4422', 999);
      }

      if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff4400';
        ctx.font = `bold ${W/12}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', W/2, H/2 - 30);
        ctx.fillStyle = '#ffaa00';
        ctx.font = `${W/20}px Courier New`;
        ctx.fillText('Очки: ' + score, W/2, H/2 + 20);
        ctx.fillStyle = '#888';
        ctx.font = `${W/30}px Courier New`;
        ctx.fillText('ENTER — рестарт', W/2, H/2 + 70);
      }

      if (gameState === 'WIN') {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#44ff44';
        ctx.font = `bold ${W/12}px Courier New`;
        ctx.textAlign = 'center';
        ctx.fillText('УРОВЕНЬ ПРОЙДЕН!', W/2, H/2 - 30);
        ctx.fillStyle = '#ffaa00';
        ctx.font = `${W/20}px Courier New`;
        ctx.fillText('Очки: ' + score, W/2, H/2 + 20);
        ctx.fillStyle = '#888';
        ctx.font = `${W/30}px Courier New`;
        ctx.fillText('ENTER — следующий', W/2, H/2 + 70);
      }

      document.getElementById('score').textContent = 'ОЧКИ: ' + score;
      document.getElementById('level-info').textContent = `Залп: ${MAX_SHOTS - projectiles.length} тачек | ENTER — стрелять`;
    }

    function nextTurn() {
      projectiles = [];
      if (targets.length === 0) {
        gameState = 'WIN';
      } else if (projectiles.length >= MAX_SHOTS) {
        gameState = 'GAMEOVER';
      } else {
        gameState = 'AIM';
        currentCar = new Car(slingshot.x - 15, slingshot.y - 60, 30, '#ee4422', 999);
      }
    }

    function shoot() {
      if (!currentCar || dragging) return;

      const angle = Math.atan2(slingshot.y - 35 - (currentCar.y + currentCar.size/2), slingshot.x + 10 - (currentCar.x + currentCar.size/2));
      const power = Math.min(80, Math.sqrt(Math.pow(slingshot.x + 10 - (currentCar.x + currentCar.size/2), 2) + Math.pow(slingshot.y - 35 - (currentCar.y + currentCar.size/2), 2)) * 1.5);

      currentCar.vx = Math.cos(angle) * power * 0.5;
      currentCar.vy = Math.sin(angle) * power * 0.5;
      currentCar.landed = false;
      currentCar.hp = 999;

      projectiles.push(currentCar);
      currentCar = null;
      gameState = 'PLAYING';
    }

    canvas.addEventListener('mousedown', e => {
      if (gameState !== 'AIM' || currentCar === null) return;
      dragging = true;
      const rect = canvas.getBoundingClientRect();
      dragStart.x = e.clientX - rect.left;
      dragStart.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousemove', e => {
      if (!dragging || !currentCar) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const dx = mx - slingshot.x - 10;
      const dy = my - slingshot.y + 35;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 80) {
        currentCar.x = slingshot.x + 10 - currentCar.size/2 + dx;
        currentCar.y = slingshot.y - 35 - currentCar.size/2 + dy;
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (dragging && currentCar) {
        shoot();
      }
      dragging = false;
    });

    let touchCar = null;
    canvas.addEventListener('touchstart', e => {
      if (gameState !== 'AIM') return;
      const rect = canvas.getBoundingClientRect();
      const tx = e.touches[0].clientX - rect.left;
      const ty = e.touches[0].clientY - rect.top;

      if (currentCar && tx > currentCar.x - 50 && tx < currentCar.x + currentCar.size + 50 && ty > currentCar.y - 50 && ty < currentCar.y + currentCar.size + 50) {
        dragging = true;
        touchCar = currentCar;
      }
    });

    canvas.addEventListener('touchmove', e => {
      if (!dragging || !touchCar) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mx = e.touches[0].clientX - rect.left;
      const my = e.touches[0].clientY - rect.top;

      const dx = mx - slingshot.x - 10;
      const dy = my - slingshot.y + 35;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 80) {
        touchCar.x = slingshot.x + 10 - touchCar.size/2 + dx;
        touchCar.y = slingshot.y - 35 - touchCar.size/2 + dy;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      if (dragging && touchCar) {
        shoot();
      }
      dragging = false;
      touchCar = null;
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (gameState === 'GAMEOVER' || gameState === 'WIN') {
          if (gameState === 'WIN') level++;
          score = 0;
          projectiles = [];
          currentCar = null;
          gameState = 'AIM';
          createTargets();
          gameState = 'PLAYING';
        } else if (gameState === 'AIM' && currentCar && !dragging) {
          shoot();
        }
      }
    });

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      level = 1;
      score = 0;
      projectiles = [];
      currentCar = null;
      gameState = 'PLAYING';
      createTargets();
      currentCar = new Car(slingshot.x - 15, slingshot.y - 60, 30, '#ee4422', 999);
    }

    startGame();
    gameLoop();

    window.addEventListener('resize', () => {
      resize();
    });
  </script>
</body>
</html>
